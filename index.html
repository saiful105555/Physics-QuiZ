<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>সাধারণ ইসলাম শিক্ষা - সাইফুল'স সাইন্স কেয়ার</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@600;700&family=Noto+Sans+Bengali:wght@400;600&display=swap');

        :root {
            --primary: #2563EB;
            --primary-hover: #1D4ED8;
            --secondary: #059669;
            --danger: #DC2626;
            --bg-gradient: linear-gradient(135deg, #EFF6FF 0%, #DBEAFE 100%);
            --card-bg: #FFFFFF;
            --text-dark: #1E293B;
            --text-light: #64748B;
            --uddipok-bg: #F0FDF4;
            --uddipok-border: #86EFAC;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-dark);
            font-family: 'Kalpurush', 'Noto Sans Bengali', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        h1, h2, h3, .brand-title {
            font-family: 'Noto Serif Bengali', serif;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 20px;
            flex: 1;
            width: 100%;
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            padding: 40px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        /* Welcome Screen Styling */
        #welcome-screen {
            text-align: center;
            animation: slideUp 0.8s ease;
            position: relative;
            overflow: hidden;
        }

        #welcome-screen::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 8px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
        }

        .brand-title {
            color: var(--primary);
            font-size: 38px;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        .exam-subtitle {
            font-size: 24px;
            color: var(--text-dark);
            margin-bottom: 30px;
            font-weight: 600;
        }

        .info-grid {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }

        .info-badge {
            background: #F8FAFC;
            padding: 15px 25px;
            border-radius: 12px;
            border: 1px solid #E2E8F0;
            font-size: 18px;
            font-weight: 600;
            color: var(--primary);
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }

        .btn-start {
            background: linear-gradient(135deg, var(--primary) 0%, #3B82F6 100%);
            color: white;
            border: none;
            padding: 16px 40px;
            border-radius: 50px;
            font-size: 22px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: 'Noto Serif Bengali', serif;
        }

        .btn-start:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 25px rgba(37, 99, 235, 0.4);
        }

        /* Exam Screen */
        #exam-screen, #result-screen, #review-screen {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .exam-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 15px 25px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 25px;
            position: sticky;
            top: 15px;
            z-index: 100;
            border-left: 5px solid var(--primary);
        }

        .header-brand {
            font-family: 'Noto Serif Bengali', serif;
            font-size: 20px;
            font-weight: 700;
            color: var(--primary);
        }

        .timer {
            font-size: 22px;
            font-weight: 700;
            color: var(--primary);
            background: #EFF6FF;
            padding: 8px 20px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .timer.warning { color: #D97706; background: #FEF3C7; }
        .timer.danger { color: var(--danger); background: #FEE2E2; animation: pulse 1s infinite; }

        .layout { display: flex; gap: 25px; }
        .main-content { flex: 3; }
        .sidebar {
            flex: 1;
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            height: fit-content;
            max-height: 85vh;
            overflow-y: auto;
            position: sticky;
            top: 90px;
        }

        /* Question Styles */
        .uddipok-box {
            background: var(--uddipok-bg);
            border: 2px solid var(--uddipok-border);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 18px;
            line-height: 1.6;
            color: #065F46;
        }

        .question-box {
            margin-bottom: 30px;
            padding: 25px;
            border: 1px solid #E2E8F0;
            border-radius: 16px;
            background: #FAFAFA;
            transition: all 0.3s;
        }
        
        .question-box:hover {
            border-color: #BFDBFE;
            box-shadow: 0 5px 15px rgba(0,0,0,0.03);
        }

        .question-text {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.5;
            color: var(--text-dark);
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-label {
            display: flex;
            align-items: center;
            padding: 14px 20px;
            background: white;
            border: 2px solid #E2E8F0;
            border-radius: 10px;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.2s;
        }

        .option-label:hover {
            border-color: #93C5FD;
            background: #EFF6FF;
        }

        .option-label input {
            margin-right: 15px;
            width: 20px;
            height: 20px;
            accent-color: var(--primary);
        }

        .option-label.selected {
            border-color: var(--primary);
            background: #EFF6FF;
            font-weight: 600;
        }

        /* Nav Panel */
        .nav-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-top: 20px;
        }

        .nav-btn {
            padding: 10px 0;
            text-align: center;
            background: #F1F5F9;
            border: 1px solid #CBD5E1;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .nav-btn:hover { background: #E2E8F0; }
        .nav-btn.answered { background: var(--secondary); color: white; border-color: var(--secondary); }
        .nav-btn.active { border: 2px solid var(--primary); background: white; color: var(--primary); transform: scale(1.1); box-shadow: 0 4px 6px rgba(0,0,0,0.1); }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
        }
        .btn:hover { background: var(--primary-hover); }
        .btn-success { background: var(--secondary); }
        .btn-success:hover { background: #047857; }
        .pagination-controls { display: flex; justify-content: space-between; margin-top: 30px; }

        /* Results & Review */
        .score-circle {
            width: 180px; height: 180px;
            border-radius: 50%;
            background: conic-gradient(var(--secondary) 0%, #E2E8F0 0);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 30px;
        }
        .score-inner {
            width: 150px; height: 150px;
            background: white; border-radius: 50%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 40px; font-weight: 700; color: var(--primary);
        }
        .stat-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 40px;
        }
        .stat-box {
            padding: 20px; border-radius: 12px; text-align: center; font-size: 20px; font-weight: 600;
        }
        .stat-correct { background: #D1FAE5; color: #065F46; }
        .stat-wrong { background: #FEE2E2; color: #991B1B; }
        .stat-unanswered { background: #F1F5F9; color: #334155; }

        .review-option { pointer-events: none; }
        .review-correct { border-color: var(--secondary) !important; background: #D1FAE5 !important; font-weight: bold; }
        .review-wrong { border-color: var(--danger) !important; background: #FEE2E2 !important; font-weight: bold; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        @media (max-width: 768px) {
            .layout { flex-direction: column; }
            .sidebar { max-height: max-content; position: static; }
            .nav-grid { grid-template-columns: repeat(8, 1fr); }
        }
        @media print {
            body { background: white; color: black; font-family: 'Kalpurush', serif; }
            .card, .container { box-shadow: none; margin: 0; padding: 0; max-width: 100%; }
            .no-print { display: none !important; }
            .question-box { page-break-inside: avoid; border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; }
            .uddipok-box { border: 1px solid #aaa; background: #f9f9f9; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Welcome Screen -->
    <div id="welcome-screen" class="card">
        <h1 class="brand-title">সাইফুল'স সাইন্স কেয়ার</h1>
        <h2 class="exam-subtitle">সাধারণ ইসলাম শিক্ষা বহুনির্বাচনি মডেল টেস্ট</h2>
        
        <div class="info-grid">
            <div class="info-badge">📋 মোট প্রশ্ন: ১৫০টি</div>
            <div class="info-badge">🎯 পূর্ণমান: ১৫০</div>
            <div class="info-badge">⏱️ সময়: ৯০ মিনিট</div>
        </div>

        <button class="btn-start" onclick="startExam()">পরীক্ষা শুরু করুন</button>
    </div>

    <!-- Exam Screen -->
    <div id="exam-screen">
        <div class="exam-header">
            <div class="header-brand">সাইফুল'স সাইন্স কেয়ার</div>
            <div class="timer" id="timer-display">⏱️ ০১:৩০:০০</div>
        </div>

        <div class="layout">
            <div class="main-content card">
                <div id="questions-container"></div>
                <div class="pagination-controls">
                    <button class="btn" id="prev-btn" onclick="changePage(-1)">আগের পৃষ্ঠা</button>
                    <button class="btn btn-success" id="next-btn" onclick="changePage(1)">পরের পৃষ্ঠা</button>
                </div>
            </div>
            
            <div class="sidebar">
                <h3 style="margin-bottom: 15px; border-bottom: 2px solid #E2E8F0; padding-bottom: 10px;">প্রশ্ন নেভিগেশন</h3>
                <p style="font-size: 14px; color: var(--text-light); font-weight: 600;">মোট: <span id="total-q">150</span> | উত্তর দেওয়া: <span id="answered-q" style="color:var(--secondary)">0</span></p>
                <div class="nav-grid" id="nav-panel"></div>
            </div>
        </div>
    </div>

    <!-- Result Screen -->
    <div id="result-screen" class="card">
        <h2 style="text-align: center; margin-bottom: 30px; font-size: 32px; color: var(--primary);">ফলাফল বিশ্লেষণ</h2>

        <div class="score-circle" id="score-circle">
            <div class="score-inner">
                <span id="res-score">0</span>
                <span style="font-size: 16px; color:#64748B;">/ 150</span>
            </div>
        </div>

        <div class="stat-grid">
            <div class="stat-box stat-correct">সঠিক উত্তর<br><span id="res-correct" style="font-size: 28px;">0</span></div>
            <div class="stat-box stat-wrong">ভুল উত্তর<br><span id="res-wrong" style="font-size: 28px;">0</span></div>
            <div class="stat-box stat-unanswered">উত্তর বাকি<br><span id="res-unanswered" style="font-size: 28px;">0</span></div>
        </div>

        <div style="text-align: center; gap: 15px; display: flex; justify-content: center; flex-wrap: wrap;" class="no-print">
            <button class="btn btn-success" style="font-size: 18px; padding: 15px 30px;" onclick="showReview()">উত্তর পর্যালোচনা করুন</button>
            <button class="btn" style="font-size: 18px; padding: 15px 30px; background: #3B82F6;" onclick="window.print()">ফলাফল প্রিন্ট করুন</button>
            <button class="btn" style="font-size: 18px; padding: 15px 30px; background: #64748B;" onclick="location.reload()">নতুন পরীক্ষা</button>
        </div>
    </div>

    <!-- Review Screen -->
    <div id="review-screen" class="card">
        <div class="no-print" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 2px solid #E2E8F0; padding-bottom: 15px;">
            <h2 style="font-size: 28px; color: var(--primary);">উত্তর পর্যালোচনা</h2>
            <button class="btn" style="background: #64748B;" onclick="location.reload()">শেষ করুন</button>
        </div>
        <div id="review-container"></div>
    </div>
</div>

<script>
    // আপনার দেওয়া ১৫০টি প্রশ্ন, অপশন এবং উত্তর
    const questionsData = [
        { id: 1, q: "ইমানের মূল বিষয় কয়টি?", o: ["ক) তিনটি", "খ) চারটি", "গ) পাঁচটি", "ঘ) সাতটি"], a: 3 },
        { id: 2, q: "তাওহিদের বিশ্বাসী ব্যক্তি কিসের প্রতি অনুপ্রাণিত হয়?", o: ["ক) সৎকর্ম", "খ) জিহাদ", "গ) দানখয়রাত", "ঘ) রাত্রি জাগরণ"], a: 0 },
        { id: 3, q: "কুরআন মাজিদ একটি-<br>i. সার্বজনীন জীবন বিধান<br>ii. শাশ্বত জীবন বিধান<br>iii. পূর্ণ জীবন বিধান<br>নিচের কোনটি সঠিক?", o: ["ক) i ও ii", "খ) ii ও iii", "গ) i ও iii", "ঘ) i, ii ও iii"], a: 3 },
        { id: 4, q: "কুফর মানুষের মধ্যে কী জন্ম দেয়?", o: ["ক) অকৃতজ্ঞতা", "খ) অহিংসা", "গ) অবহেলা", "ঘ) স্বার্থপরতা"], a: 0 },
        { id: 5, q: "পৃথিবীর সকল প্রকার জুলুমের মধ্যে সবচেয়ে বড় জুলুম কোনটি?", o: ["ক) নিফাক", "খ) শিরক", "গ) কুফর", "ঘ) ফিসক"], a: 1 },
        { id: 6, q: "উমর (রা.)-এর শাহাদাতের পর কুরআনের কপিটি কার নিকট গচ্ছিত ছিল?", o: ["ক) উসমান (রা.)", "খ) আলি (রা.)", "গ) আয়শা (রা.)", "ঘ) হাফসা (রা.)"], a: 3 },
        { id: 7, uddipok: "■ নিচের উদ্দীপকটি পড়ে ৭ ও ৮নং প্রশ্নের উত্তর দাও :<br>জনাব 'ক' মধুতে চিনির শিরা মিশিয়ে প্রতিদিন বাজারে বিক্রি করে বেশি টাকা আয় করে।", q: "'ক'-এর এরূপ কাজে তার কী প্রকাশ পেয়েছে?", o: ["ক) প্রতারণা", "খ) খিয়ানত", "গ) চালাকি", "ঘ) কুফর"], a: 0 },
        { id: 8, q: "উক্ত কাজের ফলে সমাজে-<br>i. শত্রুতা ও অবিশ্বাস বাড়ে<br>ii. আস্থা ও বিশ্বাস বাড়ে<br>iii. উক্ত ব্যক্তির গ্রহণযোগ্যতা কমে<br>নিচের কোনটি সঠিক?", o: ["ক) i", "খ) i ও ii", "গ) iii", "ঘ) i ও iii"], a: 3 },
        { id: 9, q: "নাযিরা তিলাওয়াত বলা হয়, আল-কুরআন-", o: ["ক) মুখস্থ পড়াকে", "খ) না দেখে পড়াকে", "গ) দেখে পড়াকে", "ঘ) ধীরে ধীরে পড়াকে"], a: 2 },
        { id: 10, q: "সনদ বা রাবির পরম্পরার দিক থেকে হাদিস কত প্রকার?", o: ["ক) চার", "খ) পাঁচ", "গ) ছয়", "ঘ) তিন"], a: 3 },
        { id: 11, uddipok: "■ নিচের উদ্দীপকটি পড়ে ১১ ও ১২নং প্রশ্নের উত্তর দাও :<br>ইমাম বুখারি (র.)-কে যুগের শ্রেষ্ঠ হাদিস বিশারদ বলা হয়। তিনি হাদিস সংগ্রহে নিজেকে উৎসর্গ করেছেন।", q: "ওহী লেখক সাহাবিদের সংখ্যা কত ছিল?", o: ["ক) ২৮", "খ) ৪২", "গ) ৪৭", "ঘ) ৮৬"], a: 1 },
        { id: 12, q: "ইমাম বুখারি (র.)-<br>i. অনেক হাদিস রচনা করেছেন<br>ii. ছয় লাখ হাদিস সংগ্রহ করেছেন<br>iii. প্রখর মেধার অধিকারী ছিলেন<br>নিচের কোনটি সঠিক?", o: ["ক) i", "খ) ii", "গ) ii ও iii", "ঘ) i, ii ও iii"], a: 2 },
        { id: 13, q: "শরিয়তের সর্বশেষ উৎস কী?", o: ["ক) আল-কুরআন", "খ) সুন্নাহ", "গ) ইজমা", "ঘ) কিয়াস"], a: 3 },

        { id: 143, q: "আল্লাহ তায়ালার নিকট অত্যাধিক মূল্য কোনটির?", o: ["ক) আমানতদারি", "খ) সত্যবাদিতা", "গ) কর্তব্যপরায়ণতা", "ঘ) তাকওয়া"], a: 3 },
        { id: 144, uddipok: "■ নিচের উদ্দীপকটি পড়ে ১৪৪ ও ১৪৫নং প্রশ্নের উত্তর দাও :<br>'ক' তার ইচ্ছামতো শরিয়তের বিধান পালন করে থাকে। তার মতে, মদ, জুয়া বর্তমান আধুনিক যুগে মানুষের জন্য প্রয়োজন।", q: "'ক'-এর এরূপ বিশ্বাস ও কর্মকাণ্ডের ফলে সে একজন-", o: ["ক) ফাসিক", "খ) মুনাফিক", "গ) মুশরিক", "ঘ) কাফির"], a: 0 },
        { id: 145, q: "মদ, জুয়া ইত্যাদির ফলে সমাজে সৃষ্টি হয়-<br>i. নৈতিক মূল্যবোধের অবক্ষয়<br>ii. সামাজিক বৈষম্য<br>iii. সামাজিক মর্যাদা বৃদ্ধি<br>নিচের কোনটি সঠিক?", o: ["ক) i ও ii", "খ) i ও iii", "গ) ii ও iii", "ঘ) i, ii ও iii"], a: 0 },

        { id: 147, q: "কে আল উস্তাদ নামে খ্যাতি অর্জন করেন?", o: ["ক) আল রাযি", "খ) আল বিরুনি", "গ) আল কিন্দি", "ঘ) ইবনে সিনা"], a: 1 },
        { id: 148, q: "জাবির ইবনে হাইয়্যান কোন বংশে জন্মগ্রহণ করেন?", o: ["ক) কুরাইশ", "খ) আদি", "গ) আযদ", "ঘ) আব্বাসী"], a: 2 },
        { id: 149, q: "ফিতনা দ্বারা বোঝায়-<br>i. সুশৃঙ্খল অবস্থা<br>ii. বিশৃঙ্খল অবস্থা<br>iii. অরাজক পরিস্থিতি<br>নিচের কোনটি সঠিক?", o: ["ক) i ও ii", "খ) i ও iii", "গ) ii ও iii", "ঘ) i, ii ও iii"], a: 2 },
        { id: 150, q: "'নাসির উদ্দিন তুসি' কত খ্রিষ্টাব্দে জন্মগ্রহণ করেন?", o: ["ক) ৯৮৫", "খ) ৭৮০", "গ) ১০৪৮", "ঘ) ১২০১"], a: 2 }
    ];

    let userAnswers = new Array(questionsData.length).fill(null);
    let currentPage = 0;
    const questionsPerPage = 10;
    const totalPages = Math.ceil(questionsData.length / questionsPerPage);
    
    let totalTime = 90 * 60; // 90 minutes
    let timerInterval;

    function startExam() {
        document.getElementById('welcome-screen').style.display = 'none';
        document.getElementById('exam-screen').style.display = 'block';
        renderNavPanel();
        renderQuestions();
        startTimer();
    }

    function startTimer() {
        const display = document.getElementById('timer-display');
        timerInterval = setInterval(() => {
            totalTime--;
            let h = Math.floor(totalTime / 3600), m = Math.floor((totalTime % 3600) / 60), s = totalTime % 60;
            h = h < 10 ? "0" + h : h; m = m < 10 ? "0" + m : m; s = s < 10 ? "0" + s : s;
            display.innerHTML = `⏱️ ${h}:${m}:${s}`;
            if(totalTime <= 600 && totalTime > 300) display.className = "timer warning";
            if(totalTime <= 300) display.className = "timer danger";
            if (totalTime <= 0) { clearInterval(timerInterval); submitExam(true); }
        }, 1000);
    }

    function renderQuestions() {
        const container = document.getElementById('questions-container');
        container.innerHTML = '';
        const start = currentPage * questionsPerPage;
        const end = Math.min(start + questionsPerPage, questionsData.length);

        for (let i = start; i < end; i++) {
            const q = questionsData[i];
            
            if(q.uddipok) {
                const uddipokBox = document.createElement('div');
                uddipokBox.className = 'uddipok-box';
                uddipokBox.innerHTML = q.uddipok;
                container.appendChild(uddipokBox);
            }

            const qBox = document.createElement('div');
            qBox.className = 'question-box';
            let html = `<div class="question-text">${q.id}. ${q.q}</div><div class="options-grid">`;
            
            q.o.forEach((opt, idx) => {
                const isChecked = userAnswers[i] === idx ? 'checked' : '';
                const isSelectedClass = userAnswers[i] === idx ? 'selected' : '';
                html += `
                <label class="option-label ${isSelectedClass}" onclick="selectAnswer(${i}, ${idx}, this)">
                    <input type="radio" name="q${i}" value="${idx}" ${isChecked}> ${opt}
                </label>`;
            });
            html += `</div>`;
            qBox.innerHTML = html;
            container.appendChild(qBox);
        }
        updatePaginationButtons(); updateNavPanelSelection();
    }

    function selectAnswer(qIndex, optIndex, element) {
        userAnswers[qIndex] = optIndex;
        const labels = element.parentElement.querySelectorAll('.option-label');
        labels.forEach(lbl => lbl.classList.remove('selected'));
        element.classList.add('selected');
        document.getElementById(`nav-btn-${qIndex}`).classList.add('answered');
        document.getElementById('answered-q').innerText = userAnswers.filter(a => a !== null).length;
    }

    function changePage(dir) {
        currentPage += dir;
        if(currentPage < 0) currentPage = 0;
        if(currentPage >= totalPages) currentPage = totalPages - 1;
        renderQuestions(); window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function updatePaginationButtons() {
        const prevBtn = document.getElementById('prev-btn'), nextBtn = document.getElementById('next-btn');
        prevBtn.style.visibility = currentPage === 0 ? 'hidden' : 'visible';
        if (currentPage === totalPages - 1) {
            nextBtn.innerText = "পরীক্ষা জমা দিন";
            nextBtn.onclick = () => submitExam();
        } else {
            nextBtn.innerText = "পরের পৃষ্ঠা";
            nextBtn.onclick = () => changePage(1);
        }
    }

    function renderNavPanel() {
        const panel = document.getElementById('nav-panel'); panel.innerHTML = '';
        questionsData.forEach((q, i) => {
            const btn = document.createElement('div');
            btn.className = `nav-btn ${userAnswers[i] !== null ? 'answered' : ''}`;
            btn.id = `nav-btn-${i}`; btn.innerText = q.id;
            btn.onclick = () => { currentPage = Math.floor(i / questionsPerPage); renderQuestions(); setTimeout(()=>updateNavPanelSelection(), 100); };
            panel.appendChild(btn);
        });
    }

    function updateNavPanelSelection() {
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        const start = currentPage * questionsPerPage, end = Math.min(start + questionsPerPage, questionsData.length);
        for(let i=start; i<end; i++) document.getElementById(`nav-btn-${i}`).classList.add('active');
    }

    function submitExam(autoSubmit = false) {
        const answered = userAnswers.filter(a => a !== null).length, total = questionsData.length;
        if (!autoSubmit) {
            if(!confirm(answered === total ? "আপনি সব প্রশ্নের উত্তর দিয়েছেন। পরীক্ষা জমা দিতে চান?" : `আপনার ${total - answered} টি প্রশ্নের উত্তর বাকি আছে। জমা দিতে চান?`)) return;
        }
        clearInterval(timerInterval); calculateResult();
    }

    function calculateResult() {
        document.getElementById('exam-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';
        let correct = 0, wrong = 0, unanswered = 0;
        questionsData.forEach((q, i) => { if (userAnswers[i] === null) unanswered++; else if (userAnswers[i] === q.a) correct++; else wrong++; });
        
        document.getElementById('res-score').innerText = correct;
        document.getElementById('res-correct').innerText = correct;
        document.getElementById('res-wrong').innerText = wrong;
        document.getElementById('res-unanswered').innerText = unanswered;
        
        const percentage = (correct / questionsData.length) * 100;
        document.getElementById('score-circle').style.background = `conic-gradient(var(--secondary) ${percentage}%, #E2E8F0 0)`;
    }

    function showReview() {
        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('review-screen').style.display = 'block';
        const container = document.getElementById('review-container'); container.innerHTML = '';
        
        questionsData.forEach((q, i) => {
            if(q.uddipok) {
                const uddipokBox = document.createElement('div');
                uddipokBox.className = 'uddipok-box';
                uddipokBox.innerHTML = q.uddipok;
                container.appendChild(uddipokBox);
            }

            const qBox = document.createElement('div');
            qBox.className = 'question-box';
            let statusText = userAnswers[i] === null ? 'উত্তর দেওয়া হয়নি' : (userAnswers[i] === q.a ? 'সঠিক উত্তর' : 'ভুল উত্তর');
            let statusColor = userAnswers[i] === null ? '#64748B' : (userAnswers[i] === q.a ? '#059669' : '#DC2626');

            let html = `
                <div style="display:flex; justify-content:space-between; margin-bottom: 15px;">
                    <div class="question-text" style="margin-bottom:0;">${q.id}. ${q.q}</div>
                    <div style="color:${statusColor}; font-weight:bold; font-size:16px;">${statusText}</div>
                </div>
                <div class="options-grid">`;
            
            q.o.forEach((opt, idx) => {
                let extraClass = 'review-option ';
                if (idx === q.a) extraClass += 'review-correct ';
                else if (userAnswers[i] === idx && idx !== q.a) extraClass += 'review-wrong ';
                const isChecked = userAnswers[i] === idx ? 'checked' : '';
                html += `<label class="option-label ${extraClass}"><input type="radio" disabled ${isChecked}> ${opt}</label>`;
            });
            html += `</div>`;
            qBox.innerHTML = html;
            container.appendChild(qBox);
        });
    }
</script>
