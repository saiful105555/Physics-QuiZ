<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>১০ম শ্রেণী টিউটোরিয়াল প্রস্তুতি - পদার্থবিজ্ঞান</title>
    <style>
        :root {
            --primary-color: #0d6efd;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #212529;
            --correct-color: #198754;
            --wrong-color: #dc3545;
            --whatsapp-color: #25D366;
        }

        body {
            font-family: 'SolaimanLipi', 'Kalpurush', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 15px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            position: relative;
        }

        header {
            text-align: center;
            border-bottom: 2px solid #e9ecef;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        header h1 {
            color: var(--primary-color);
            font-size: 24px;
            margin-bottom: 5px;
        }

        header h2 {
            font-size: 18px;
            color: #495057;
            margin-top: 0;
        }

        .meta-info {
            background-color: #e7f1ff;
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            color: #084298;
            display: inline-block;
            margin-top: 5px;
        }

        /* Timer Sticky Box */
        #timer-box {
            position: sticky;
            top: 10px;
            z-index: 1000;
            background: #fff3cd;
            border: 2px solid #ffecb5;
            color: #664d03;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #timer {
            color: #dc3545;
            font-size: 20px;
        }

        .question-card {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px 20px;
            margin-bottom: 20px;
            transition: all 0.2s ease;
        }

        .question-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .options {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        @media (min-width: 576px) {
            .options {
                grid-template-columns: 1fr 1fr;
            }
        }

        .option-label {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            font-size: 15px;
        }

        .option-label:hover {
            background-color: #f8f9fa;
        }

        .option-label input {
            margin-right: 10px;
            accent-color: var(--primary-color);
        }

        /* Result styling */
        .question-card.correct {
            border: 2px solid var(--correct-color);
            background-color: #f0fff4;
        }

        .question-card.wrong {
            border: 2px solid var(--wrong-color);
            background-color: #fff5f5;
        }

        .option-label.selected-correct {
            background-color: #d1e7dd;
            border-color: var(--correct-color);
            font-weight: bold;
        }

        .option-label.selected-wrong {
            background-color: #f8d7da;
            border-color: var(--wrong-color);
        }

        .option-label.show-correct {
            background-color: #d1e7dd;
            border-color: var(--correct-color);
            font-weight: bold;
        }

        .btn-submit {
            display: block;
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.3s;
        }

        .btn-submit:hover {
            background-color: #0b5ed7;
        }

        .btn-whatsapp {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background-color: var(--whatsapp-color);
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            margin-top: 15px;
            transition: background 0.3s;
        }

        .btn-whatsapp:hover {
            background-color: #1eb855;
        }

        #result-box {
            display: none;
            background: #e7f1ff;
            border: 2px solid var(--primary-color);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            margin-bottom: 25px;
        }

        #result-box h3 {
            margin-top: 0;
            color: #084298;
            font-size: 22px;
        }

        .score-summary {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 15px 0;
            flex-wrap: wrap;
        }

        .score-card {
            background: #ffffff;
            border: 1px solid #b6d4fe;
            border-radius: 8px;
            padding: 10px 20px;
            min-width: 130px;
        }

        .score-card .title {
            font-size: 13px;
            color: #6c757d;
            margin-bottom: 2px;
        }

        .score-card .val {
            font-size: 20px;
            font-weight: bold;
            color: #084298;
        }

        .warning-text {
            color: #dc3545;
            font-size: 14px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>১০ম শ্রেণী টিউটোরিয়াল প্রস্তুতি</h1>
        <h2>বিষয়: পদার্থবিজ্ঞান (১ম অধ্যায়)</h2>
        <div class="meta-info">সার্বিক তত্ত্বাবধানে: ইঞ্জিঃ সাইফুল ইসলাম</div>
    </header>

    <div id="timer-box">

        </a>
    </div>

    <form id="quizForm">
        <div id="questions-container"></div>
        <button type="button" id="submit-btn" class="btn-submit" onclick="submitQuiz()">উত্তর সাবমিট করুন</button>
    </form>
</div>

    },
    {
        q: "২৭. কাজের একক জুল (J) কে মৌলিক এককে প্রকাশ করলে কোনটি হবে?",
        options: ["(ক) kg·m·s⁻²", "(খ) kg·m²·s⁻²", "(গ) kg·m²·s⁻¹", "(ঘ) kg·m⁻¹·s⁻²"],
        ans: 1
    },
    {
        q: "২৮. পিচ পরিমাপ করা হয় কোন যন্ত্র দিয়ে?",
        options: ["(ক) স্কেল", "(খ) স্ক্রুগজ", "(গ) থার্মোমিটার", "(ঘ) থামোমিটার"],
        ans: 1
    },
    {
        q: "২৯. আপেক্ষিক ত্রুটি যত কম হবে, পরিমাপটি—",
        options: ["(ক) তত কম নিখুঁত হবে", "(খ) তত বেশি নিখুঁত হবে", "(গ) অপরিবর্তিত থাকবে", "(ঘ) ত্রুটিপূর্ণ থাকবে"],
        ans: 1
    },
    {
        q: "৩০. এক মোল (1 mol) পদার্থে কয়টি অনু বা পরমাণু থাকে?",
        options: ["(ক) 6.023 × 10²³", "(খ) 6.023 × 10²²", "(গ) 3.00 × 10⁸", "(ঘ) 1.6 × 10⁻¹⁹"],
        ans: 0
    }
];

function startTimer() {
    timerInterval = setInterval(() => {
        let minutes = Math.floor(timeInSeconds / 60);
        let seconds = timeInSeconds % 60;

        let displayMinutes = minutes < 10 ? '০' + convertToBengaliNumeral(minutes) : convertToBengaliNumeral(minutes);
        let displaySeconds = seconds < 10 ? '০' + convertToBengaliNumeral(seconds) : convertToBengaliNumeral(seconds);

        document.getElementById('timer').innerText = `${displayMinutes}:${displaySeconds}`;

        if (timeInSeconds <= 0) {
            clearInterval(timerInterval);
            alert("⏰ সময় শেষ! আপনার উত্তর স্বয়ংক্রিয়ভাবে সাবমিট হচ্ছে।");
            submitQuiz(true); // Auto submit
        }
        timeInSeconds--;
    }, 1000);
}

function convertToBengaliNumeral(num) {
    const bnNums = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
    return num.toString().split('').map(n => bnNums[n] || n).join('');
}

function renderQuiz() {
    const container = document.getElementById('questions-container');
    container.innerHTML = '';

    quizData.forEach((q, index) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        card.id = `q-card-${index}`;

        let optionsHTML = '';
        q.options.forEach((opt, optIndex) => {
            optionsHTML += `
                <label class="option-label" id="label-${index}-${optIndex}">
                    <input type="radio" name="q${index}" value="${optIndex}">
                    ${opt}
                </label>
            `;
        });

        card.innerHTML = `
            <div class="question-title">${q.q}</div>
            <div class="options">${optionsHTML}</div>
        `;
        container.appendChild(card);
    });
}

function submitQuiz(isAuto = false) {
    clearInterval(timerInterval);
    document.getElementById('timer-box').style.display = 'none';

    let score = 0;
    let userAnswers = {};

    quizData.forEach((q, index) => {
        const card = document.getElementById(`q-card-${index}`);
        const selected = document.querySelector(`input[name="q${index}"]:checked`);
        
        card.classList.remove('correct', 'wrong');
        q.options.forEach((_, optIndex) => {
            const label = document.getElementById(`label-${index}-${optIndex}`);
            label.classList.remove('selected-correct', 'selected-wrong', 'show-correct');
            
            // সাবমিট করার পর সব ইনপুট ডিসেবল করা
            const input = label.querySelector('input');
            if (input) input.disabled = true;
        });

        if (selected) {
            const userAns = parseInt(selected.value);
            userAnswers[index] = userAns;
            if (userAns === q.ans) {
                score++;
                card.classList.add('correct');
                document.getElementById(`label-${index}-${userAns}`).classList.add('selected-correct');
            } else {
                card.classList.add('wrong');
                document.getElementById(`label-${index}-${userAns}`).classList.add('selected-wrong');
                document.getElementById(`label-${index}-${q.ans}`).classList.add('show-correct');
            }
        } else {
            card.classList.add('wrong');
            document.getElementById(`label-${index}-${q.ans}`).classList.add('show-correct');
        }
    });

    const totalQuestions = quizData.length;
    const percentage = convertToBengaliNumeral(((score / totalQuestions) * 100).toFixed(1));
    const scoreBn = convertToBengaliNumeral(score);
    const totalQuestionsBn = convertToBengaliNumeral(totalQuestions);

    // LocalStorage-এ ডাটা সেভ করা হচ্ছে (যাতে ২য় বার পরীক্ষা দেওয়া না যায়)
    const resultData = {
        submitted: true,
        score: score,
        scoreBn: scoreBn,
        percentage: percentage,
        userAnswers: userAnswers
    };
    localStorage.setItem('ssc_physics_ch1_quiz', JSON.stringify(resultData));

    showResultUI(scoreBn, totalQuestionsBn, percentage);
}

function showResultUI(scoreBn, totalQuestionsBn, percentage) {
    const resultBox = document.getElementById('result-box');
    const submitBtn = document.getElementById('submit-btn');

    document.getElementById('score-marks').innerText = `${scoreBn} / ${totalQuestionsBn}`;
    document.getElementById('score-percent').innerText = `${percentage}%`;

    const shareMessage = `*১০ম শ্রেণী টিউটোরিয়াল প্রস্তুতি (পদার্থবিজ্ঞান)*\n` +
                         `সার্বিক তত্ত্বাবধানে: ইঞ্জিঃ সাইফুল ইসলাম\n\n` +
                         `🎯 *আমার অর্জিত মার্কস:* ${scoreBn}/${totalQuestionsBn}\n` +
                         `📊 *সাফল্যের হার:* ${percentage}%\n\n` +
                         `আপনিও আপনার প্রস্তুতি যাচাই করুন!`;
    
    const whatsappBtn = document.getElementById('whatsapp-share');
    whatsappBtn.href = `https://api.whatsapp.com/send?text=${encodeURIComponent(shareMessage)}`;

    resultBox.style.display = 'block';
    submitBtn.style.display = 'none';

    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// পূর্বের অ্যাটেম্পট চেক করার ফাংশন
function checkPreviousAttempt() {
    const savedResult = localStorage.getItem('ssc_physics_ch1_quiz');
    if (savedResult) {
        const data = JSON.parse(savedResult);
        document.getElementById('timer-box').style.display = 'none';
        
        quizData.forEach((q, index) => {
            const card = document.getElementById(`q-card-${index}`);
            const userAns = data.userAnswers ? data.userAnswers[index] : undefined;

            if (userAns !== undefined) {
                if (userAns === q.ans) {
                    card.classList.add('correct');
                    document.getElementById(`label-${index}-${userAns}`).classList.add('selected-correct');
                } else {
                    card.classList.add('wrong');
                    document.getElementById(`label-${index}-${userAns}`).classList.add('selected-wrong');
                    document.getElementById(`label-${index}-${q.ans}`).classList.add('show-correct');
                }
            } else {
                card.classList.add('wrong');
                document.getElementById(`label-${index}-${q.ans}`).classList.add('show-correct');
            }

            q.options.forEach((_, optIndex) => {
                const input = document.getElementById(`label-${index}-${optIndex}`).querySelector('input');
                if (input) input.disabled = true;
            });
        });

        const totalQuestionsBn = convertToBengaliNumeral(quizData.length);
        showResultUI(data.scoreBn || convertToBengaliNumeral(data.score), totalQuestionsBn, data.percentage);
    } else {
        startTimer();
    }
}

// কুইজ শুরু
renderQuiz();
checkPreviousAttempt();
</script>
