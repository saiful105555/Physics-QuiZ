            align-items: center;
            flex-wrap: wrap;

            font-weight: bold;
            color: #444;

            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 16px;
            display: inline-block;
        }

        .question-card {
            background: #fafafa;
            border: 1px solid #e0e0e0;

            border-radius: 8px;
            padding: 15px;

            transition: all 0.3s ease;

            font-weight: bold;
            margin-bottom: 12px;
            color: #1e293b;
        }

        .options-group {

        }

            align-items: center;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            padding: 10px 14px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 15px;
        }

            background: #e2e8f0;
        }

        .option-btn input[type="radio"] {
            margin-right: 12px;
            transform: scale(1.2);
            cursor: pointer;
        }

            display: block;
            width: 100%;
            background: linear-gradient(135deg, #4e54c8, #8f94fb);
            color: white;
            border: none;
            padding: 14px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(78, 84, 200, 0.4);
            margin-top: 20px;
        }

        .btn-submit:hover {

        }

            display: none;
            text-align: center;
            background: #f0fdf4;
            border: 2px solid #22c55e;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

            margin-bottom: 10px;

let totalSeconds = 30 * 60;
let timerInterval;

window.onload = function() {
    if (localStorage.getItem("examSubmitted_class8_light")) {
        showAlreadySubmitted();
    } else {
        renderQuestions();
        startTimer();
    }
};

function renderQuestions() {
    const container = document.getElementById("questions");
    let html = "";

    questionsData.forEach((q, index) => {
        html += `
            <div class="question-card" id="qcard-${index}">
                <div class="q-title">${q.question}</div>
                <div class="options-group">
                    ${q.options.map((opt, optIdx) => `
                        <label class="option-btn" id="opt-label-${index}-${optIdx}">
                            <input type="radio" name="q${index}" value="${optIdx}">
                            ${opt}
                        </label>
                    `).join('')}
                </div>
            </div>
        `;
    });

    container.innerHTML = html;
}

function startTimer() {
    timerInterval = setInterval(() => {
        totalSeconds--;
        let minutes = Math.floor(totalSeconds / 60);
        let seconds = totalSeconds % 60;

        let displayM = minutes < 10 ? "০" + convertToBangla(minutes) : convertToBangla(minutes);
        let displayS = seconds < 10 ? "০" + convertToBangla(seconds) : convertToBangla(seconds);

        document.getElementById("timer").innerText = `সময় বাকি: ${displayM}:${displayS}`;

        if (totalSeconds <= 0) {
            clearInterval(timerInterval);
            alert("সময় শেষ! আপনার উত্তর স্বয়ংক্রিয়ভাবে জমা হচ্ছে।");
            submitExam();
        }
    }, 1000);
}

function convertToBangla(num) {
    const bnNums = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
    return num.toString().split('').map(n => bnNums[n] || n).join('');
}

function submitExam() {
    clearInterval(timerInterval);
    localStorage.setItem("examSubmitted_class8_light", "true");

    let score = 0;

    questionsData.forEach((q, index) => {
        const selected = document.querySelector(`input[name="q${index}"]:checked`);
        const userAns = selected ? parseInt(selected.value) : -1;

        const radios = document.getElementsByName(`q${index}`);
        radios.forEach(r => r.disabled = true);

        const correctLabel = document.getElementById(`opt-label-${index}-${q.correct}`);
        if (correctLabel) {
            correctLabel.classList.add("correct-ans");
        }

        if (userAns === q.correct) {
            score++;
        } else if (userAns !== -1) {
            const wrongLabel = document.getElementById(`opt-label-${index}-${userAns}`);
            if (wrongLabel) {
                wrongLabel.classList.add("wrong-ans");
            }
        }
    });

    document.getElementById("submitBtn").style.display = "none";

    const resultBox = document.getElementById("resultBox");
    const scoreText = document.getElementById("scoreText");
    scoreText.innerText = `আপনার প্রাপ্ত নম্বর: ${convertToBangla(score)} / ${convertToBangla(questionsData.length)}`;
    resultBox.style.display = "block";

    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showAlreadySubmitted() {
    const container = document.getElementById("quizContainer");
    container.innerHTML = `
        <div class="already-submitted">
            <h2>আপনি ইতিমধ্যে এই পরীক্ষাটি দিয়েছেন!</h2>
            <p style="font-size: 16px; color: #666;">একবার উত্তর জমা দেওয়ার পর পুনরায় পরীক্ষা দেওয়া গ্রহণযোগ্য নয়।</p>
            <p style="margin-top: 15px; font-weight: bold; color: #4e54c8;">সার্বিক তত্ত্বাবধানে: সাইফুল ইসলাম (০১৬২২১৮৬৮১২)</p>
        </div>
    `;
}
