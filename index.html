<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher ID Card Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla:ital@0;1&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Noto Sans Bengali', sans-serif;
            background-color: #eef2f3;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 30px;
            gap: 50px;
        }
        .form-section { background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); width: 400px; }
        .form-section h2 { margin-bottom: 20px; text-align: center; color: #2b592f; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 6px; font-weight: 600; color: #333; }
        .input-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; font-family: 'Noto Sans Bengali', sans-serif; }
        .btn { width: 100%; padding: 12px; background-color: #2b592f; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        .btn:hover { background-color: #1e4221; }
        .btn-download { background-color: #b8860b; }
        .btn-download:hover { background-color: #8b6508; }
        
        .preview-section { display: flex; flex-direction: column; align-items: center; gap: 20px; }
        
        /* ID CARD STYLING */
        .id-card-wrapper {
            width: 540px; height: 860px; background: #f7f6f1; position: relative; overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); transform: scale(0.7); transform-origin: top center;
        }
        .top-ribbon {
            position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 140px; height: 160px;
            background-color: #2b592f; clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 88%, 0 100%);
            display: flex; justify-content: center; align-items: center; padding-bottom: 15px;
        }
        .top-ribbon img { width: 100px; height: 100px; border-radius: 50%; background: #fff; padding: 3px; }
        .school-name {
            text-align: center; color: #265d29; font-family: 'Tiro Bangla', serif; font-size: 38px;
            font-weight: bold; margin-top: 180px; line-height: 1.1;
        }
        .photo-area { margin: 25px auto; width: 250px; height: 300px; border: 6px solid #d4af37; border-radius: 12px; overflow: hidden; background-color: #fff; }
        .photo-area img { width: 100%; height: 100%; object-fit: cover; }
        .details-area { position: absolute; bottom: 60px; left: 45px; border-left: 7px solid #265d29; padding-left: 15px; }
        .details-area p { font-size: 25px; color: #000; font-weight: 600; margin-bottom: 7px; line-height: 1.3; }
        .qr-area { position: absolute; bottom: 160px; right: 45px; width: 110px; height: 110px; background: #fff; padding: 5px; }
        .signature-area { position: absolute; bottom: 35px; right: 35px; text-align: center; }
        .signature-area img { width: 120px; display: block; margin: 0 auto 5px auto; }
        .signature-line { width: 170px; height: 2px; background-color: #000; margin: 0 auto 5px auto; }
        .signature-area p { font-size: 22px; font-weight: bold; color: #000; }
        
        @media (max-width: 900px) { body { flex-direction: column; align-items: center; } .id-card-wrapper { transform: scale(0.6); } }
    </style>
</head>
<body>

    <!-- Form Section -->
    <div class="form-section">
        <h2>শিক্ষক আইডি কার্ড তথ্য</h2>
        <form id="idForm">
            <div class="input-group">
                <label>নাম:</label>
                <input type="text" id="inpName" value="সাইফুল ইসলাম">
            </div>
            <div class="input-group">
                <label>পদবী:</label>
                <input type="text" id="inpDesig" value="সহকারী শিক্ষক">
            </div>
            <div class="input-group">
                <label>ডিপার্টমেন্ট:</label>
                <input type="text" id="inpDept" value="আইসিটি">
            </div>
            <div class="input-group">
                <label>শিফট:</label>
                <input type="text" id="inpShift" value="জবা">
            </div>
            <div class="input-group">
                <label>ফোন:</label>
                <input type="text" id="inpPhone" value="০১৬২২১৮৬৮১২">
            </div>
            <div class="input-group">
                <label>রক্তের গ্রুপ:</label>
                <input type="text" id="inpBlood" value="এ পজেটিভ">
            </div>
            <div class="input-group">
                <label>আপনার ছবি আপলোড করুন:</label>
                <input type="file" id="inpPhoto" accept="image/*">
            </div>
            <button type="button" class="btn" onclick="generateCard()">আপডেট করুন</button>
        </form>
    </div>

    <!-- Preview & Download Section -->
    <div class="preview-section">
        <div class="id-card-wrapper" id="idCard">
            <!-- Ribbon with Local Logo -->
            <div class="top-ribbon">
                <img src="logo.png" alt="Logo" onerror="this.src='https://via.placeholder.com/100?text=Logo'">
            </div>

            <!-- School Name -->
            <div class="school-name">ইবনে তাইমিয়া স্কুল এন্ড কলেজ</div>

            <!-- Teacher Photo -->
            <div class="photo-area">
                <img id="cardPhoto" src="https://via.placeholder.com/250x300?text=Photo" alt="Teacher">
            </div>

            <!-- Details Section -->
            <div class="details-area">
                <p>নাম: <span id="outName">সাইফুল ইসলাম</span></p>
                <p>পদবী: <span id="outDesig">সহকারী শিক্ষক</span></p>
                <p>ডিপার্টমেন্ট: <span id="outDept">আইসিটি</span></p>
                <p>শিফট: <span id="outShift">জবা</span></p>
                <p>ফোন: <span id="outPhone">০১৬২২১৮৬৮১২</span></p>
                <p>রক্তের গ্রুপ: <span id="outBlood">এ পজেটিভ</span></p>
            </div>

            <!-- QR Code -->
            <div class="qr-area" id="qrCodeDiv"></div>

            <!-- Local Signature -->
            <div class="signature-area">
                <img src="signature.png" alt="Signature" onerror="this.src='https://via.placeholder.com/120x40?text=Signature'">
                <div class="signature-line"></div>
                <p>প্রিন্সিপাল এর স্বাক্ষর</p>
            </div>
        </div>
        
        <button type="button" class="btn btn-download" onclick="downloadPDF()">PDF ডাউনলোড করুন</button>
    </div>

    <script>
        let qrCode;
        
        // Ensure library is loaded before creating QR
        document.addEventListener("DOMContentLoaded", function() {
            setTimeout(() => {
                qrCode = new QRCode(document.getElementById("qrCodeDiv"), {
                    width: 110,
                    height: 110,
                    colorDark : "#000000",
                    colorLight : "#ffffff",
                    correctLevel : QRCode.CorrectLevel.H
                });
                generateCard();
            }, 500); // Slight delay ensures DOM is fully ready
        });

        function generateCard() {
            const name = document.getElementById('inpName').value;
            const desig = document.getElementById('inpDesig').value;
            const dept = document.getElementById('inpDept').value;
            const shift = document.getElementById('inpShift').value;
            const phone = document.getElementById('inpPhone').value;
            const blood = document.getElementById('inpBlood').value;
            const photoInput = document.getElementById('inpPhoto');

            document.getElementById('outName').innerText = name;
            document.getElementById('outDesig').innerText = desig;
            document.getElementById('outDept').innerText = dept;
            document.getElementById('outShift').innerText = shift;
            document.getElementById('outPhone').innerText = phone;
            document.getElementById('outBlood').innerText = blood;

            if (photoInput.files && photoInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('cardPhoto').src = e.target.result;
                }
                reader.readAsDataURL(photoInput.files[0]);
            }

            if(qrCode) {
                const qrData = `নাম: ${name}\nপদবী: ${desig}\nফোন: ${phone}\nরক্তের গ্রুপ: ${blood}`;
                qrCode.clear();
                qrCode.makeCode(qrData);
            }
        }

        function downloadPDF() {
            const element = document.getElementById('idCard');
            const opt = {
                margin:       0,
                filename:     'Teacher_ID_Card.pdf',
                image:        { type: 'jpeg', quality: 1.0 },
                html2canvas:  { scale: 3, useCORS: true, letterRendering: true },
                jsPDF:        { unit: 'mm', format: [54, 86], orientation: 'portrait' }
            };

            element.style.transform = 'scale(1)';
            html2pdf().set(opt).from(element).save().then(() => {
                element.style.transform = window.innerWidth <= 900 ? 'scale(0.6)' : 'scale(0.7)';
            });
        }
    </script>
</body>
</html>
