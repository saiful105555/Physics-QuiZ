<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>সাইফুল'স সাইন্স কেয়ার - সাধারণ গণিত MCQ</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600&family=Noto+Serif+Bengali:wght@600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: '#0a192f', royal: '#1d4ed8', gold: '#ffd700',
                    },
                    fontFamily: {
                        serif: ['"Noto Serif Bengali"', 'serif'],
                        sans: ['"Noto Sans Bengali"', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <!-- KaTeX for Math Rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { background: linear-gradient(135deg, #0a192f 0%, #112240 50%, #1d4ed8 100%); background-attachment: fixed; color: white; }
        .glass-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1); }
        .option-label { transition: all 0.3s ease; }
        input[type="radio"]:checked + .option-label { background-color: rgba(255, 215, 0, 0.2); border-color: #ffd700; box-shadow: 0 0 15px rgba(255, 215, 0, 0.3); }
        .nav-btn { transition: all 0.2s ease; }
        .nav-btn:hover:not(:disabled) { transform: translateY(-2px); }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }
        ::-webkit-scrollbar-thumb { background: #ffd700; border-radius: 4px; }
        .progress-circle { background: conic-gradient(#ffd700 var(--progress), rgba(255,255,255,0.1) 0deg); }
    </style>
</head>
<body class="font-sans min-h-screen flex flex-col antialiased selection:bg-gold selection:text-navy">

    <header class="glass-card sticky top-0 z-50 p-4 border-b border-white/10">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-gold flex items-center justify-center text-navy font-bold text-xl"><i class="fa-solid fa-atom"></i></div>
                <h1 class="font-serif text-xl md:text-2xl font-bold text-gold tracking-wider">সাইফুল'স সাইন্স কেয়ার</h1>
            </div>
            <div id="header-timer" class="hidden font-mono text-lg md:text-xl font-bold bg-navy/50 px-4 py-2 rounded-lg border border-gold/30 text-gold">
                <i class="fa-regular fa-clock mr-2"></i><span id="time-display">00:00</span>
            </div>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center p-4">
        
        <!-- Welcome Screen -->
        <div id="welcome-screen" class="glass-card rounded-2xl p-8 max-w-2xl w-full text-center">
            <h2 class="font-serif text-3xl md:text-4xl font-bold text-white mb-2">সাধারণ গণিত</h2>
            <p class="text-gold text-lg md:text-xl mb-8 font-semibold">(বহুনির্বাচনি পরীক্ষা)</p>
            
            <div class="grid grid-cols-2 gap-4 mb-8 text-left">
                <div class="bg-white/5 p-4 rounded-xl border border-white/10">
                    <p class="text-sm text-gray-400">মোট প্রশ্ন ও পূর্ণমান</p>
                    <p class="text-2xl font-bold text-white" id="ws-total-q">0</p>
                </div>
                <div class="bg-white/5 p-4 rounded-xl border border-white/10">
                    <p class="text-sm text-gray-400">মোট সময়</p>
                    <p class="text-2xl font-bold text-white" id="ws-time">0 মি.</p>
                </div>
            </div>
            <button onclick="startExam()" class="bg-gold hover:bg-yellow-400 text-navy font-bold py-3 px-8 rounded-full text-lg w-full md:w-auto shadow-[0_0_20px_rgba(255,215,0,0.4)] transition-transform hover:-translate-y-1">
                <i class="fa-solid fa-play mr-2"></i> পরীক্ষা শুরু করুন
            </button>
        </div>

        <!-- Exam Screen -->
        <div id="exam-screen" class="hidden w-full max-w-6xl grid grid-cols-1 lg:grid-cols-4 gap-6">
            <div class="lg:col-span-3 glass-card rounded-2xl p-6 md:p-8 flex flex-col">
                <div class="flex justify-between items-center mb-6 pb-4 border-b border-white/10">
                    <span class="text-lg font-semibold text-gray-300">প্রশ্ন: <span id="current-q-num" class="text-gold text-xl font-bold">1</span> / <span id="total-q-num"></span></span>
                    <span class="bg-royal/50 px-3 py-1 rounded text-sm text-blue-200">মান: ১</span>
                </div>
                <div class="flex-grow">
                    <h3 id="question-text" class="text-xl md:text-2xl font-medium leading-relaxed mb-8"></h3>
                    <div id="options-container" class="space-y-4"></div>
                </div>
                <div class="mt-8 pt-6 border-t border-white/10 flex justify-between gap-4">
                    <button onclick="prevQuestion()" id="btn-prev" class="nav-btn bg-white/10 hover:bg-white/20 px-6 py-2 rounded-lg font-medium disabled:opacity-50"><i class="fa-solid fa-chevron-left mr-2"></i> পূর্ববর্তী</button>
                    <button onclick="nextQuestion()" id="btn-next" class="nav-btn bg-royal hover:bg-blue-600 px-6 py-2 rounded-lg font-medium border border-blue-400/50">পরবর্তী <i class="fa-solid fa-chevron-right ml-2"></i></button>
                </div>
            </div>

            <div class="glass-card rounded-2xl p-6 lg:h-[600px] flex flex-col">
                <h4 class="font-serif text-lg font-bold mb-4 text-center border-b border-white/10 pb-2">নেভিগেশন</h4>
                <div id="palette-grid" class="grid grid-cols-5 gap-2 overflow-y-auto pr-2 custom-scrollbar flex-grow content-start"></div>
                <div class="mt-4 pt-4 border-t border-white/10">
                    <div class="w-full bg-white/10 rounded-full h-2 mb-4"><div id="progress-bar" class="bg-gold h-2 rounded-full transition-all duration-300" style="width: 0%"></div></div>
                    <button onclick="confirmSubmit()" class="w-full bg-green-600 hover:bg-green-500 py-3 rounded-lg font-bold shadow-[0_0_15px_rgba(34,197,94,0.4)]"><i class="fa-solid fa-check-double mr-2"></i> জমা দিন</button>
                </div>
            </div>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="hidden w-full max-w-4xl glass-card rounded-2xl p-8">
            <div class="text-center mb-10">
                <h2 class="font-serif text-3xl font-bold text-gold mb-2">ফলাফল ড্যাশবোর্ড</h2>
                <p class="text-gray-300 text-lg" id="result-msg"></p>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-10 items-center">
                <div class="flex flex-col items-center justify-center">
                    <div id="circular-chart" class="progress-circle w-40 h-40 rounded-full flex items-center justify-center mb-4" style="--progress: 0%;">
                        <div class="w-32 h-32 bg-navy rounded-full flex items-center justify-center flex-col">
                            <span id="score-percentage" class="text-3xl font-bold text-white">0%</span>
                        </div>
                    </div>
                    <div id="grade-display" class="text-xl font-bold px-4 py-1 rounded bg-gold text-navy"></div>
                </div>
                <div class="md:col-span-2 grid grid-cols-2 gap-4">
                    <div class="bg-white/5 p-4 rounded-xl border border-white/10 text-center"><p class="text-gray-400">মোট</p><p class="text-2xl font-bold" id="res-total">0</p></div>
                    <div class="bg-white/5 p-4 rounded-xl border border-green-500/30 text-center"><p class="text-gray-400">সঠিক</p><p class="text-2xl font-bold text-green-400" id="res-correct">0</p></div>
                    <div class="bg-white/5 p-4 rounded-xl border border-red-500/30 text-center"><p class="text-gray-400">ভুল</p><p class="text-2xl font-bold text-red-400" id="res-wrong">0</p></div>
                    <div class="bg-white/5 p-4 rounded-xl border border-yellow-500/30 text-center"><p class="text-gray-400">বাদ দেওয়া</p><p class="text-2xl font-bold text-yellow-400" id="res-skipped">0</p></div>
                </div>
            </div>
            <div class="flex justify-center gap-4 border-t border-white/10 pt-8">
                <button onclick="showAnswerSheet()" class="nav-btn bg-royal hover:bg-blue-600 px-6 py-2 rounded-lg font-medium"><i class="fa-solid fa-book-open mr-2"></i> উত্তরপত্র</button>
                <button onclick="location.reload()" class="nav-btn bg-white/10 hover:bg-white/20 px-6 py-2 rounded-lg font-medium"><i class="fa-solid fa-rotate-right mr-2"></i> পুনরায় পরীক্ষা</button>
            </div>
        </div>

        <!-- Answer Sheet -->
        <div id="answer-sheet-screen" class="hidden w-full max-w-4xl glass-card rounded-2xl p-6 md:p-8">
            <div class="flex justify-between items-center mb-6 pb-4 border-b border-white/10">
                <h2 class="font-serif text-2xl font-bold text-gold">বিস্তারিত উত্তরপত্র</h2>
                <button onclick="document.getElementById('answer-sheet-screen').classList.add('hidden'); document.getElementById('result-screen').classList.remove('hidden');" class="bg-white/10 hover:bg-white/20 px-4 py-2 rounded"><i class="fa-solid fa-arrow-left mr-2"></i> ড্যাশবোর্ড</button>
            </div>
            <div id="answers-container" class="space-y-6"></div>
        </div>

    </main>

    <!-- Modal -->
    <div id="submit-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center z-[100] opacity-0 transition-opacity">
        <div class="bg-navy border border-gold/30 p-8 rounded-2xl max-w-md w-full text-center shadow-2xl" id="modal-content">
            <h3 class="text-2xl font-bold text-white mb-4">পরীক্ষা জমা দেবেন?</h3>
            <p class="text-gray-300 mb-6" id="modal-unanswered-text"></p>
            <div class="flex gap-4">
                <button onclick="closeModal()" class="flex-1 bg-white/10 py-2 rounded-lg">ফিরে যান</button>
                <button onclick="submitExam()" class="flex-1 bg-green-600 hover:bg-green-500 py-2 rounded-lg font-bold">হ্যাঁ, জমা দিন</button>
            </div>
        </div>
    </div>

    <script>
        // All Questions with optimized keys (q=question, o=options, c=correct index, e=explanation)
        const questions = [
            { q: "A সেটের উপাদান সংখ্যা \\(n\\) হলে A এর উপসেটের সংখ্যা কত?", o: ["\\(2n - 1\\)", "\\(2^n\\)", "\\(2^n - 1\\)", "\\(2^n - 2\\)"], c: 1, e: "সূত্রানুযায়ী উপসেটের সংখ্যা \\(2^n\\)।" },
            { q: "B সেট থেকে A সেটে একটি সম্পর্ক R হলে নিচের কোনটি সঠিক?", o: ["\\(R \\subset A \\times B\\)", "\\(R \\subset A \\times B\\)", "\\(R \\subset (A \\cup B)\\)", "\\(R \\subset B \\times A\\)"], c: 3, e: "B থেকে A সেটে সম্পর্ক হলো B ও A এর কার্তেসীয় গুণজের উপসেট।" },
            { q: "\\(p - \\frac{1}{p} = 7\\) হলে \\((p + \\frac{1}{p})^2\\) এর মান কত?", o: ["45", "47", "51", "53"], c: 3, e: "\\((a+b)^2 = (a-b)^2 + 4ab = 7^2 + 4 = 53\\)।" },
            { q: "\\(x + \\frac{1}{x} = 5\\) হলে, i. \\(x^2 - \\frac{1}{x^2} = 5\\sqrt{21}\\) ii. \\(x^3 - \\frac{1}{x^3} = 110\\) iii. \\(x^2 - 5x + 1 = 0\\)", o: ["i, ii", "ii, iii", "i, iii", "i, ii, iii"], c: 2, e: "i ও iii সঠিক। ii ভুল কারণ কিউবের মান আলাদা হবে।" },
            { q: "\\(x^3 - y^3 = 63\\) এবং \\(xy = 4\\) হলে \\(x - y\\) এর মান কত?", o: ["1", "2", "3", "4"], c: 2, e: "\\((x-y)^3 + 3xy(x-y) = 63\\)। মান 3 বসালে সমীকরণ সিদ্ধ হয়।" },
            { q: "\\(18x^3 + 15x^2 - x - 2\\) এর একটি উৎপাদক কোনটি?", o: ["\\(3x + 1\\)", "\\(3x - 2\\)", "\\(2x + 1\\)", "\\(2x - 1\\)"], c: 0, e: "ভাগশেষ উপপাদ্য অনুযায়ী \\(x = -1/3\\) বসালে মান 0 হয়, তাই \\(3x+1\\) উৎপাদক।" },
            { q: "একটি চতুর্ভুজের কর্ণদ্বয় পরস্পরকে সমকোণে সমদ্বিখণ্ডিত করলে তা একটি —।", o: ["আয়ত", "রম্বস", "সামান্তরিক", "ট্রাপিজিয়াম"], c: 1, e: "রম্বস এবং বর্গের কর্ণ সমকোণে সমদ্বিখণ্ডিত করে।" },
            { q: "6 সে.মি. এবং 4 সে.মি. ব্যাসার্ধের দুইটি বৃত্ত বহিঃস্থভাবে স্পর্শ করলে কেন্দ্রদ্বয়ের দূরত্ব কত?", o: ["2", "4", "5", "10"], c: 3, e: "বহিঃস্থভাবে স্পর্শ করলে দূরত্ব = ব্যাসার্ধের যোগফল = 6 + 4 = 10।" },
            { q: "একটি বর্গ একটি বৃত্তে অন্তর্লিখিত। বৃত্তের ও বর্গের ক্ষেত্রফলের অনুপাত কত?", o: ["\\(\\pi : \\sqrt{2}\\)", "\\(\\pi : 2\\)", "\\(\\pi : 2\\sqrt{2}\\)", "\\(\\pi : 4\\)"], c: 1, e: "বৃত্তের ব্যাস = বর্গের কর্ণ। সমাধান করলে ক্ষেত্রফলের অনুপাত \\(\\pi : 2\\) হয়।" },
            { q: "\\(\\sin^2\\theta + \\cos^2\\theta = ?\\)", o: ["1", "2", "4", "16"], c: 0, e: "এটি একটি মৌলিক ত্রিকোণমিতিক অভেদ।" },
            { q: "\\(\\frac{\\sin\\theta}{x} = \\frac{\\cos\\theta}{y}\\) হলে \\(\\text{cosec }\\theta = ?\\)", o: ["\\(\\frac{x^2+y^2}{y}\\)", "\\(\\frac{x^2+y^2}{x}\\)", "\\(\\frac{\\sqrt{x^2+y^2}}{y}\\)", "\\(\\frac{\\sqrt{x^2+y^2}}{x}\\)"], c: 3, e: "\\(\\tan\\theta = x/y\\)। পিথাগোরাস অনুযায়ী অতিভুজ \\(\\sqrt{x^2+y^2}\\)।" },
            { q: "\\(\\text{cosec } x = \\sqrt{2} = 2 \\cos y\\) হলে \\(\\cot (x+y) = ?\\)", o: ["0", "\\(\\frac{1}{\\sqrt{3}}\\)", "\\(\\sqrt{3}\\)", "অসংজ্ঞায়িত"], c: 0, e: "x=45, y=45। \\(\\cot(90) = 0\\)।" },
            { q: "কোনো বর্গক্ষেত্রের বাহুর দৈর্ঘ্য 10% বৃদ্ধি পেলে ক্ষেত্রফল শতকরা কত বৃদ্ধি পাবে?", o: ["10%", "20%", "21%", "44%"], c: 2, e: "শর্টকাট: \\(10 + 10 + (10 \\times 10)/100 = 21\\%\\)।" },
            { q: "A = \\{a, b, c, d, e\\} এর প্রকৃত উপসেটের সংখ্যা কত?", o: ["31", "32", "33", "64"], c: 0, e: "\\(2^5 - 1 = 32 - 1 = 31\\)।" },
            { q: "ধাপ বিচ্যুতি -2, শ্রেণি মধ্যমান 33 এবং শ্রেণি ব্যবধান 5 হলে অনুমিত গড় কত?", o: ["23", "28", "38", "43"], c: 0, e: "\\(33 + (-2 \\times 5) = 23\\)।" },
            { q: "a, b, c ক্রমিক সমানুপাতী হলে— i. \\(b^2 = ac\\) ii. \\(2b = a + c\\) iii. \\(\\frac{a + b}{b} = \\frac{b + c}{c}\\)", o: ["i, ii", "ii, iii", "i, iii", "i, ii, iii"], c: 2, e: "i এবং iii সমানুপাতের ধর্ম।" },
            { q: "একটি বৃত্তাংশের ক্ষেত্রফল 77 বর্গমিটার এবং বৃত্তের ব্যাসার্ধ 21 মিটার। কেন্দ্রে উৎপন্ন কোণ কত?", o: ["\\(15^\\circ\\)", "\\(20^\\circ\\)", "\\(25^\\circ\\)", "\\(30^\\circ\\)"], c: 1, e: "সূত্র: \\(\\frac{\\theta}{360} \\times \\pi r^2 = 77\\)।" },
            { q: "একটি সুষম অষ্টভুজের একটি কোণের মান কত?", o: ["\\(72^\\circ\\)", "\\(108^\\circ\\)", "\\(135^\\circ\\)", "\\(360^\\circ\\)"], c: 2, e: "অন্তঃস্থ কোণ = \\(\\frac{(8-2)\\times 180}{8} = 135^\\circ\\)।" },
            { q: "সামান্তরিকের দুই বাহুর অনুপাত 2:3 এবং পরিসীমা 60 সে.মি.। বৃহত্তম বাহু কত?", o: ["6", "12", "18", "24"], c: 2, e: "2(2x+3x) = 60 => 10x=60 => x=6। বৃহত্তম বাহু 3x=18।" },
            { q: "সামান্তরিকের বাহু 12 ও 18 এবং কোণ \\(30^\\circ\\)। ক্ষেত্রফল কত?", o: ["54", "108", "162", "216"], c: 1, e: "ক্ষেত্রফল = ab sin\\theta = 12 \\times 18 \\times \\sin(30) = 108।" },
            { q: "একটি ঘনকের আয়তন 64 ঘন সে.মি. হলে পৃষ্ঠতলের কর্ণের দৈর্ঘ্য কত?", o: ["\\(4\\sqrt{2}\\)", "\\(4\\sqrt{3}\\)", "\\(8\\sqrt{2}\\)", "\\(8\\sqrt{3}\\)"], c: 0, e: "বাহু a=4। পৃষ্ঠতলের কর্ণ = \\(a\\sqrt{2} = 4\\sqrt{2}\\)।" },
            { q: "7, 15, 6, 9, 7, 11, 8, 14 উপাত্তসমূহের মধ্যক কত?", o: ["10.5", "8.5", "7.5", "6.5"], c: 1, e: "ক্রমানুসারে সাজালে ৪র্থ ও ৫ম পদের গড় = 8.5।" },
            { q: "যোজিত গণসংখ্যা প্রয়োজন— i. গড় নির্ণয়ে ii. মধ্যক নির্ণয়ে iii. অজিভ রেখা নির্ণয়ে", o: ["i, ii", "ii, iii", "i, iii", "i, ii, iii"], c: 1, e: "মধ্যক এবং অজিভ রেখার জন্য যোজিত গণসংখ্যা লাগে।" },

                timeLeft--;
                display.innerText = `${toBn(Math.floor(timeLeft / 60)).padStart(2,'০')}:${toBn(timeLeft % 60).padStart(2,'০')}`;
                if(timeLeft < 300) document.getElementById('header-timer').classList.replace('text-gold', 'text-red-500');
            }, 1000);
        }

        function buildPalette() {
            const grid = document.getElementById('palette-grid');
            grid.innerHTML = '';
            questions.forEach((_, idx) => {
                const btn = document.createElement('button');
                btn.id = `pal-btn-${idx}`;
                btn.className = `w-10 h-10 rounded-lg font-bold border transition-colors flex items-center justify-center bg-white/10 text-gray-300 border-white/20`;
                btn.innerText = toBn(idx + 1);
                btn.onclick = () => { currentQuestionIndex = idx; renderQuestion(); };
                grid.appendChild(btn);
            });
        }

        function renderQuestion() {
            const q = questions[currentQuestionIndex];
            document.getElementById('current-q-num').innerText = toBn(currentQuestionIndex + 1);
            document.getElementById('question-text').innerHTML = `${toBn(currentQuestionIndex + 1)}. ${q.q}`;
            
            const optsCont = document.getElementById('options-container');
            optsCont.innerHTML = '';
            const prefixes = ['ক', 'খ', 'গ', 'ঘ'];
            
            q.o.forEach((opt, idx) => {
                const isChecked = userAnswers[currentQuestionIndex] === idx ? 'checked' : '';
                optsCont.insertAdjacentHTML('beforeend', `
                    <label class="block relative cursor-pointer group">
                        <input type="radio" name="opt" value="${idx}" class="absolute opacity-0 w-0 h-0" ${isChecked} onchange="userAnswers[${currentQuestionIndex}]=${idx}; updatePalette();">
                        <div class="option-label bg-white/5 border border-white/10 rounded-xl p-4 flex gap-4 hover:bg-white/10">
                            <div class="w-8 h-8 rounded-full bg-navy border border-white/20 flex items-center justify-center shrink-0 font-bold">${prefixes[idx]}</div>
                            <div class="text-lg w-full">${opt}</div>
                        </div>
                    </label>
                `);
            });

            document.getElementById('btn-prev').disabled = currentQuestionIndex === 0;
            const nextBtn = document.getElementById('btn-next');
            if (currentQuestionIndex === questions.length - 1) {
                nextBtn.innerHTML = 'জমা দিন'; nextBtn.classList.replace('bg-royal', 'bg-green-600'); nextBtn.onclick = confirmSubmit;
            } else {
                nextBtn.innerHTML = 'পরবর্তী <i class="fa-solid fa-chevron-right ml-2"></i>'; nextBtn.classList.replace('bg-green-600', 'bg-royal'); nextBtn.onclick = nextQuestion;
            }

            updatePalette();
            renderMathInElement(document.getElementById('question-text'), { delimiters: [{left: "\\(", right: "\\)", display: false}] });
            renderMathInElement(optsCont, { delimiters: [{left: "\\(", right: "\\)", display: false}] });
        }

        function updatePalette() {
            const progress = (userAnswers.filter(a => a !== null).length / questions.length) * 100;
            document.getElementById('progress-bar').style.width = `${progress}%`;

            questions.forEach((_, idx) => {
                const btn = document.getElementById(`pal-btn-${idx}`);
                btn.className = `w-10 h-10 rounded-lg font-bold border transition-colors flex items-center justify-center ${userAnswers[idx] !== null ? 'bg-green-500 text-white border-green-600' : 'bg-white/10 text-gray-300 border-white/20'} ${idx === currentQuestionIndex ? 'ring-2 ring-gold scale-110' : ''}`;
            });
        }

        function nextQuestion() { if (currentQuestionIndex < questions.length - 1) { currentQuestionIndex++; renderQuestion(); } }
        function prevQuestion() { if (currentQuestionIndex > 0) { currentQuestionIndex--; renderQuestion(); } }

        function confirmSubmit() {
            const missing = userAnswers.filter(a => a === null).length;
            document.getElementById('modal-unanswered-text').innerText = missing > 0 ? `আপনি ${toBn(missing)}টি প্রশ্নের উত্তর দেননি।` : `আপনি সব প্রশ্নের উত্তর দিয়েছেন।`;
            const modal = document.getElementById('submit-modal');
            modal.classList.remove('hidden'); modal.classList.add('flex');
            setTimeout(() => modal.classList.remove('opacity-0'), 10);
        }

        function closeModal() {
            const modal = document.getElementById('submit-modal');
            modal.classList.add('opacity-0');
            setTimeout(() => { modal.classList.add('hidden'); modal.classList.remove('flex'); }, 300);
        }

        function submitExam() {
            clearInterval(timerInterval); closeModal();
            document.getElementById('exam-screen').classList.add('hidden');
            document.getElementById('header-timer').classList.add('hidden');
            
            let cor = 0, wr = 0, sk = 0;
            userAnswers.forEach((ans, i) => { if (ans === null) sk++; else if (ans === questions[i].c) cor++; else wr++; });
            
            const perc = Math.round((cor / questions.length) * 100);
            document.getElementById('res-total').innerText = toBn(questions.length);
            document.getElementById('res-correct').innerText = toBn(cor);
            document.getElementById('res-wrong').innerText = toBn(wr);
            document.getElementById('res-skipped').innerText = toBn(sk);
            document.getElementById('score-percentage').innerText = toBn(perc) + '%';
            
            let grade = perc>=80 ? 'A+' : perc>=70 ? 'A' : perc>=60 ? 'A-' : perc>=50 ? 'B' : perc>=40 ? 'C' : 'F';
            document.getElementById('grade-display').innerText = `Grade: ${grade}`;
            document.getElementById('result-msg').innerText = perc>=80 ? 'অসাধারণ পারফরম্যান্স!' : perc>=50 ? 'ভালো করেছেন, আরও উন্নতি সম্ভব।' : 'আপনাকে আরও পড়তে হবে।';

            document.getElementById('result-screen').classList.remove('hidden');
            setTimeout(() => document.getElementById('circular-chart').style.setProperty('--progress', perc + '%'), 500);
            genAnswerSheet();
        }

        function showAnswerSheet() {
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('answer-sheet-screen').classList.remove('hidden');
        }

        function genAnswerSheet() {
            const cont = document.getElementById('answers-container');
            const pre = ['ক', 'খ', 'গ', 'ঘ'];
            questions.forEach((q, i) => {
                const uAns = userAnswers[i], isCor = uAns === q.c, isSk = uAns === null;
                const badge = isCor ? '<span class="text-green-400 bg-green-500/20 px-2 rounded">সঠিক</span>' : isSk ? '<span class="text-yellow-400 bg-yellow-500/20 px-2 rounded">বাদ দেওয়া</span>' : '<span class="text-red-400 bg-red-500/20 px-2 rounded">ভুল</span>';
                
                let opts = '';
                q.o.forEach((o, oi) => {
                    const style = oi === q.c ? 'text-green-400 font-bold bg-green-500/10' : (oi === uAns ? 'text-red-400 line-through bg-red-500/10' : 'text-gray-400');
                    opts += `<p class="${style} rounded px-2 py-1 mb-1">${pre[oi]}) ${o}</p>`;
                });

                cont.insertAdjacentHTML('beforeend', `
                    <div class="bg-white/5 p-5 rounded-xl border ${isCor ? 'border-green-500/30' : isSk ? 'border-white/10' : 'border-red-500/30'}">
                        <div class="flex justify-between items-start mb-3"><h4 class="text-lg pr-4">${toBn(i+1)}. ${q.q}</h4>${badge}</div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-2 mb-3">${opts}</div>
                        <div class="bg-blue-900/30 p-2 rounded text-sm text-blue-200"><strong>ব্যাখ্যা:</strong> ${q.e}</div>
                    </div>
                `);
            });
            renderMathInElement(document.getElementById('answer-sheet-screen'), { delimiters: [{left: "\\(", right: "\\)", display: false}] });
        }
    </script>
</body>
</html>
