<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>জীববিজ্ঞান মেগা MCQ পরীক্ষা</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            margin: 0;
            padding: 20px;
            color: #2c3e50;
        }
        .container {
            max-width: 850px;
            margin: 0 auto;
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2980b9;
            margin-bottom: 5px;
            font-size: 2em;
        }
        .subtitle {
            text-align: center;
            color: #7f8c8d;
            font-size: 1.1em;
            margin-bottom: 35px;
        }
        .question-card {
            background: #f8faff;
            border-left: 6px solid #3498db;
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.04);
            transition: 0.3s;
        }
        .question-card:hover {
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            transform: translateY(-2px);
        }
        .question-title {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 15px;
            color: #34495e;
            line-height: 1.5;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .options label {
            display: flex;
            align-items: center;
            cursor: pointer;
            padding: 12px 15px;
            border-radius: 6px;
            background: #ffffff;
            border: 1px solid #dcdde1;
            transition: all 0.2s ease-in-out;
            font-size: 1.05em;
        }
        .options label:hover {
            background: #eef2f5;
            border-color: #bdc3c7;
        }
        input[type="radio"] {
            margin-right: 15px;
            transform: scale(1.3);
            cursor: pointer;
        }
        .submit-btn {
            display: block;
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1.4em;
            font-weight: bold;
            cursor: pointer;
            margin-top: 40px;
            box-shadow: 0 4px 15px rgba(56, 239, 125, 0.4);
            transition: 0.3s;
        }
        .submit-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        
        /* Highlight colors for Result */
        .correct {
            background: #d4edda !important;
            border-color: #28a745 !important;
            color: #155724;
            font-weight: bold;
        }
        .wrong {
            background: #f8d7da !important;
            border-color: #dc3545 !important;
            color: #721c24;
            font-weight: bold;
        }
        
        /* Popup Result Box */
        #result-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 999;
        }
        #result-box {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #fff;
            padding: 40px 50px;
            border-radius: 15px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.3);
            text-align: center;
            z-index: 1000;
            border: 4px solid #38ef7d;
        }
        #result-box h2 {
            margin: 0 0 15px 0;
            color: #2c3e50;
            font-size: 2em;
        }
        #result-box p {
            font-size: 1.4em;
            margin: 0 0 25px 0;
            color: #34495e;
        }
        #result-box button {
            padding: 12px 25px;
            background: #2980b9;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1.1em;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        #result-box button:hover {
            background: #1f6391;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>জীববিজ্ঞান মেগা মডেল টেস্ট</h1>
    <p class="subtitle">সবগুলো প্রশ্নের উত্তর দিন এবং শেষে Submit করে ফলাফল যাচাই করুন</p>
    
    <div id="quiz-container"></div>

    <button class="submit-btn" onclick="submitExam()">পরীক্ষা সাবমিট করুন</button>
</div>

<div id="result-overlay"></div>
<div id="result-box">
    <h2>ফলাফল</h2>
    <p id="score-text"></p>
    <button onclick="closeResult()">সঠিক উত্তরগুলো দেখুন</button>
</div>

<script>
    const questions = [
        // Set 1 (From first few images)
        { q: "১. প্রকৃতি বিজ্ঞানের প্রাচীনতম শাখা কোনটি?", o: ["ক) জীববিজ্ঞান", "খ) বনবিজ্ঞান", "গ) কৃষিবিজ্ঞান", "ঘ) সমুদ্রবিজ্ঞান"], a: 0 },
        { q: "২. ক্যান্সার নির্ণায়ক বিদ্যা কোন শাখার অন্তর্ভুক্ত?", o: ["ক) ফার্মেসি", "খ) বায়োইনফরমেটিকস্", "গ) জীবপ্রযুক্তি", "ঘ) অণুজীববিজ্ঞান"], a: 0 },
        { q: "৩. কোনটি ভৌত বিজ্ঞানের অন্তর্ভুক্ত?", o: ["ক) Morphology", "খ) Palaeontology", "গ) Entomology", "ঘ) Biochemistry"], a: 3 },
        { q: "৪. শারীরবিদ্যার আলোচ্য বিষয় কোনটি?", o: ["ক) জীবের বিবর্তন", "খ) ভ্রূণের বিকাশ", "গ) সালোকসংশ্লেষণ", "ঘ) টিস্যুর বিন্যাস"], a: 2 },
        { q: "৫. ফলিত জীববিজ্ঞানের শাখা কোনটি?", o: ["ক) হিস্টোলজি", "খ) বাস্তুবিদ্যা", "গ) ভ্রূণবিদ্যা", "ঘ) কীটতত্ত্ব"], a: 1 },
        { q: "৬. ব্যাকটেরিয়ার রাজ্য কোনটি?", o: ["ক) মনেরা", "খ) প্রোটিস্টা", "গ) ফানজাই", "ঘ) প্লান্টি"], a: 0 },
        { q: "৭. ডায়াটম কোন রাজ্যের জীব?", o: ["ক) মনেরা", "খ) প্রোটিস্টা", "গ) ফানজাই", "ঘ) প্লান্টি"], a: 1 },
        { q: "৮. কনজুগেশনের মাধ্যমে কোন জীবে যৌন জনন ঘটে?", o: ["ক) শৈবাল", "খ) ইস্ট", "গ) পেনিসিলিয়াম", "ঘ) ব্যাকটেরিয়া"], a: 3 },
        { q: "৯. নীলাভ সবুজ শৈবাল কোন রাজ্যের অন্তর্ভুক্ত?", o: ["ক) মনেরা", "খ) ফানজাই", "গ) প্রোটিস্টা", "ঘ) অ্যানিমেলিয়া"], a: 0 },
        { q: "১০. উদ্ভিদের ক্ষেত্রে দ্বিপদ নামকরণ পদ্ধতি কোনটি?", o: ["ক) ICZN", "খ) IMVN", "গ) IMCB", "ঘ) ICBN"], a: 3 },
        { q: "১১. কোন রাজ্যটি সপুষ্পক উদ্ভিদ বিশিষ্ট?", o: ["ক) প্লান্টি", "খ) ফানজাই", "গ) মনেরা", "ঘ) প্রোটিস্টা"], a: 0 },
        { q: "১২. কোন প্রাণী বুদ্ধিভিত্তিকভাবে উন্নত?", o: ["ক) গরিলা", "খ) মানুষ", "গ) শিম্পাঞ্জি", "ঘ) বানর"], a: 1 },
        { q: "১৩. জীবজগতকে ছয়টি রাজ্যে ভাগ করেন কে?", o: ["ক) ক্যারোলাস লিনিয়াস", "খ) মারগুলিস", "গ) আর.এইচ. হুইটেকার", "ঘ) টমাস কেভলিয়ার-স্মিথ"], a: 3 },
        { q: "১৪. কোন রাজ্যের জীবের দেহে জটিল টিস্যুতন্ত্র থাকে?", o: ["ক) প্রোটিস্টা", "খ) মনেরা", "গ) ফানজাই", "ঘ) অ্যানিমেলিয়া"], a: 3 },
        
        // Set 2
        { q: "১৫. কোন অঙ্গাণুটি ব্যাকটেরিয়াতে উপস্থিত থাকে?", o: ["ক) মাইটোকন্ড্রিয়া", "খ) এন্ডোপ্লাজমিক রেটিকুলাম", "গ) প্লাস্টিড", "ঘ) রাইবোজোম"], a: 3 },
        { q: "১৬. কোনটি মনেরা রাজ্যের অন্তর্গত?", o: ["ক) ব্যাকটেরিয়া", "খ) অ্যামিবা", "গ) ইস্ট", "ঘ) ভুটা"], a: 0 },

        { q: "১৮. নিচের কোন জীবটিতে ক্রোমাটিন বস্তু সাইটোপ্লাজমে ছড়ানো থাকে?", o: ["ক) পেনিসিলিয়াম", "খ) প্যারামেসিয়াম", "গ) অ্যামিবা", "ঘ) নীলাভ সবুজ শৈবাল"], a: 3 },
        { q: "১৯. কোনটি ইস্ট ও ব্যাকটেরিয়ার ক্ষেত্রে প্রযোজ্য?", o: ["ক) এককোষী", "খ) দ্বি-বিভাজন ঘটে", "গ) নিউক্লিওলাস আছে", "ঘ) উন্নত টিস্যুতন্ত্র"], a: 0 },
        { q: "২০. Plasmid বহনকারী জীবাণুটি কোন রাজ্যের অন্তর্ভুক্ত?", o: ["ক) মনেরা", "খ) প্রোটিস্টা", "গ) ফানজাই", "ঘ) প্লান্টি"], a: 0 },
        { q: "২১. অ্যামিবা কোন রাজ্যের অন্তর্ভুক্ত?", o: ["ক) মনেরা", "খ) ফানজাই", "গ) প্রোটিস্টা", "ঘ) প্লান্টি"], a: 2 },
        { q: "২২. কোনগুলো প্রোটিস্টা রাজ্যের জীব?", o: ["ক) ইস্ট, নস্টক", "খ) ডায়াটম, প্যারামেসিয়াম", "গ) নস্টক, ডায়াটম", "ঘ) পেনিসিলিয়াম, প্যারামেসিয়াম"], a: 1 },
        { q: "২৩. প্যারামেসিয়াম কোন রাজ্যের জীব?", o: ["ক) মনেরা", "খ) ফানজাই", "গ) প্রোটিস্টা", "ঘ) প্লান্টি"], a: 2 },
        
        // Set 3 
        { q: "২৪. কোনটি প্রোটিস্টার উদাহরণ?", o: ["ক) ব্যাকটেরিয়া", "খ) মাশরুম", "গ) প্যারামেসিয়াম", "ঘ) পেনিসিলিয়াম"], a: 2 },
        { q: "২৫. নিচের কোনটিতে সালোকসংশ্লেষণ হয়?", o: ["ক) অ্যামিবা", "খ) ইস্ট", "গ) হাইড্রা", "ঘ) ডায়াটম"], a: 3 },
        { q: "২৬. ফানজাই এর ক্ষেত্রে প্রযোজ্য-", o: ["ক) এরা প্রধানত মৃতজীবী", "খ) কোষপ্রাচীর সেলুলোজ নির্মিত", "গ) নিজ ক্ষমতায় নড়াচড়া করতে পারে", "ঘ) এদের জননকোষ বহুকোষী"], a: 0 },
        { q: "২৭. কোন জীবটি শোষণ পদ্ধতিতে খাদ্য গ্রহণ করে?", o: ["ক) মস", "খ) কাঁঠাল গাছ", "গ) মাশরুম", "ঘ) সবুজ শৈবাল"], a: 2 },
        { q: "২৮. কোনটি Penicillium এর কোষপ্রাচীর তৈরি করে?", o: ["ক) প্রোটিন", "খ) সুবেরিন", "গ) লিপিড", "ঘ) কাইটিন"], a: 3 },
        { q: "২৯. নিচের কোনটিতে স্পোর দিয়ে বংশবৃদ্ধি হয়?", o: ["ক) প্যারামেসিয়াম", "খ) পেনিসিলিয়াম", "গ) ডায়াটম", "ঘ) নীলাভ সবুজ শৈবাল"], a: 1 },
        { q: "৩০. মৃতজীবী বা পরজীবীদের স্থান দেওয়া হয়েছে কোন রাজ্যে?", o: ["ক) মনেরা", "খ) ফানজাই", "গ) প্রোটিস্টা", "ঘ) অ্যানিমেলিয়া"], a: 1 },
        { q: "৩১. নিচের কোনটির দেহ মাইসেলিয়াম দ্বারা গঠিত?", o: ["ক) ব্যাকটেরিয়া", "খ) মাশরুম", "গ) প্যারামেসিয়াম", "ঘ) ডায়াটম"], a: 1 },

        { q: "৩৩. মাশরুমের কোষপ্রাচীর কী দ্বারা গঠিত?", o: ["ক) লিপিড", "খ) পেকটিন", "গ) লিগনিন", "ঘ) কাইটিন"], a: 3 },

        // Set 4 (Cell Division)
        { q: "৩৫. অ্যাস্টার-রে বিচ্ছুরিত হয় কোন ধাপে?", o: ["ক) প্রোফেজ", "খ) প্রো-মেটাফেজ", "গ) মেটাফেজ", "ঘ) অ্যানাফেজ"], a: 1 },
        { q: "৩৬. সাইটোকাইনেসিসের পূর্বে কোনটি ঘটে?", o: ["ক) প্রোফেজ", "খ) মেটাফেজ", "গ) টেলোফেজ", "ঘ) ইন্টারফেজ"], a: 2 },

        { q: "৩৮. জিনের আদান-প্রদান ঘটে কোন বিভাজনের মাধ্যমে?", o: ["ক) মাইটোসিস", "খ) মিয়োসিস", "গ) অ্যামাইটোসিস", "ঘ) দ্বি-বিভাজন"], a: 1 },

        { q: "৪০. জননকোষের সংখ্যা বৃদ্ধি পায় কোন বিভাজনের কারণে?", o: ["ক) মিয়োসিস", "খ) অ্যামাইটোসিস", "গ) মাইটোসিস", "ঘ) ক্যারিওকাইনেসিস"], a: 2 },
        { q: "৪১. কোনটিতে মিয়োসিস কোষ বিভাজন ঘটে?", o: ["ক) ডিম্বাণুযন্ত্রে", "খ) পরাগধানীতে", "গ) শস্য কোষে", "ঘ) জেনারেটিভ কোষে"], a: 1 },
        { q: "৪২. নিচের কোন ভাইরাস ক্যান্সার কোষ সৃষ্টিতে সহায়তা করে?", o: ["ক) HIV", "খ) প্যাপিলোমা", "গ) র‍্যাবিস", "ঘ) রুবিওলা"], a: 1 },
        { q: "৪৩. অ্যানাফেজ ধাপে L আকৃতির ক্রোমোজোমকে কী বলে?", o: ["ক) মেটাসেন্ট্রিক", "খ) অ্যাক্রোসেন্ট্রিক", "গ) সাবমেটাসেন্ট্রিক", "ঘ) টেলোসেন্ট্রিক"], a: 2 },
        { q: "৪৪. কোষ বিভাজনের কোন পর্যায়ে ক্রোমোজোমের সেন্ট্রোমিয়ারগুলো দুভাগে বিভক্ত হয়?", o: ["ক) প্রোফেজ", "খ) মেটাফেজ", "গ) টেলোফেজ", "ঘ) অ্যানাফেজ"], a: 3 },
        { q: "৪৫. মিয়োসিস বিভাজনে নিউক্লিয়াস কয়বার বিভাজিত হয়?", o: ["ক) পাঁচ", "খ) চার", "গ) তিন", "ঘ) দুই"], a: 3 },
        { q: "৪৬. মিয়োসিস কোষ বিভাজনের মাধ্যমে কোনটি ঘটে?", o: ["ক) জীবের ক্ষতস্থান পূরণ হয়", "খ) প্রজাতিতে বৈচিত্র্যের সৃষ্টি হয়", "গ) টিউমার ও ক্যান্সার হতে পারে", "ঘ) অপত্য কোষে ক্রোমোজোম সংখ্যা সমান থাকে"], a: 1 },
        { q: "৪৭. মানবদেহে মিয়োসিস কোষ বিভাজনে প্রতিটি অপত্য কোষে কয়টি ক্রোমোজোম থাকে?", o: ["ক) ২১টি", "খ) ২২টি", "গ) ২৩টি", "ঘ) ২৪টি"], a: 2 },
        { q: "৪৮. কোন কোষ বিভাজন প্রক্রিয়ায় DNA এর পরিমাণ অর্ধেক হয়ে যায়?", o: ["ক) মিয়োসিস", "খ) মাইটোসিস", "গ) অ্যামাইটোসিস", "ঘ) মাইটোকাইনেসিস"], a: 0 },
        { q: "৪৯. মিয়োসিসের গুরুত্ব কী?", o: ["ক) জননকোষ সৃষ্টি", "খ) প্রাণীর দৈহিক বৃদ্ধি", "গ) দেহকোষ সৃষ্টি", "ঘ) উদ্ভিদের বৃদ্ধি"], a: 0 },
        { q: "৫০. মিয়োসিস কোষ বিভাজনের দ্বিতীয় বিভাজনটি কোনটির অনুরূপ?", o: ["ক) মাইটোসিস", "খ) মিয়োসিস-১", "গ) মাইটোসিস-২", "ঘ) মিয়োসিস-২"], a: 0 }
    ];

    const container = document.getElementById('quiz-container');

    // রেন্ডারিং কোয়েশ্চেন
    questions.forEach((q, index) => {
        const card = document.createElement('div');
        card.className = 'question-card';

        const title = document.createElement('div');
        title.className = 'question-title';
        title.innerText = q.q;
        card.appendChild(title);

        const optionsDiv = document.createElement('div');
        optionsDiv.className = 'options';

        q.o.forEach((opt, optIndex) => {
            const label = document.createElement('label');
            label.id = `lbl-${index}-${optIndex}`;
            
            const radio = document.createElement('input');
            radio.type = 'radio';
            radio.name = `q${index}`;
            radio.value = optIndex;

            label.appendChild(radio);
            label.appendChild(document.createTextNode(' ' + opt));
            optionsDiv.appendChild(label);
        });

        card.appendChild(optionsDiv);
        container.appendChild(card);
    });

    // সাবমিট ফাংশন
    function submitExam() {
        let score = 0;

        questions.forEach((q, index) => {
            const options = document.getElementsByName(`q${index}`);
            let answered = false;

            options.forEach(opt => {
                const label = document.getElementById(`lbl-${index}-${opt.value}`);
                // Reset colors if submitted multiple times
                label.classList.remove('correct', 'wrong');
                opt.disabled = true; // Lock inputs after submit

                if (opt.checked) {
                    answered = true;
                    if (parseInt(opt.value) === q.a) {
                        score++;
                        label.classList.add('correct');
                    } else {
                        label.classList.add('wrong');
                    }
                }
            });

            // Show correct answer anyway
            const correctLabel = document.getElementById(`lbl-${index}-${q.a}`);
            correctLabel.classList.add('correct');
        });

        // Show Score popup
        document.getElementById('score-text').innerHTML = `আপনার প্রাপ্ত নম্বর:<br><strong>${score} / ${questions.length}</strong>`;
        document.getElementById('result-overlay').style.display = 'block';
        document.getElementById('result-box').style.display = 'block';
    }

    // পপআপ ক্লোজ ফাংশন
    function closeResult() {
        document.getElementById('result-overlay').style.display = 'none';
        document.getElementById('result-box').style.display = 'none';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
</script>

</body>
</html>
