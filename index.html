        { q: "৪২. DNA-এর প্রধান ভূমিকা কী?", o: ["ক) বংশগত তথ্য সংরক্ষণ ও বহন", "খ) খাদ্য হজম করা", "গ) অক্সিজেন পরিবহন", "ঘ) পানি শোষণ"], a: 0 },
        { q: "৪৩. DNA-এর নাইট্রোজেনঘটিত ক্ষারকের মধ্যে কোনটি থাকে?", o: ["ক) ইউরাসিল", "খ) থাইমিন", "গ) শুধু ইউরাসিল", "ঘ) কেবল গ্লুকোজ"], a: 1 },
        { q: "৪৪. RNA-তে থাইমিনের পরিবর্তে কোন ক্ষারক থাকে?", o: ["ক) ইউরাসিল", "খ) অ্যাডেনিন", "গ) গুয়ানিন", "ঘ) সাইটোসিন"], a: 0 },
        { q: "৪৫. নিচের কোনটি DNA-এর একটি নাইট্রোজেনঘটিত ক্ষারক?", o: ["ক) রাইবোজ", "খ) ফসফেট", "গ) অ্যাডেনিন", "ঘ) গ্লুকোজ"], a: 2 },
        { q: "৪৬. পানির একটি গুরুত্বপূর্ণ কাজ কোনটি?", o: ["ক) দ্রাবক হিসেবে কাজ করা", "খ) বংশগত তথ্য বহন করা", "গ) প্রোটিনের একক হিসেবে কাজ করা", "ঘ) ক্রোমোজোম তৈরি করা"], a: 0 },
        { q: "৪৭. ভিটামিন সম্পর্কে কোনটি সঠিক?", o: ["ক) দেহে খুব বেশি পরিমাণে প্রয়োজন হয়", "খ) অল্প পরিমাণে প্রয়োজন হলেও গুরুত্বপূর্ণ", "গ) সবসময় শক্তির প্রধান উৎস", "ঘ) সব ভিটামিন দেহে তৈরি হয়"], a: 1 },
        { q: "৪৮. কোন ভিটামিনের অভাবে রাতকানা রোগ হতে পারে?", o: ["ক) ভিটামিন A", "খ) ভিটামিন B₁", "গ) ভিটামিন C", "ঘ) ভিটামিন D"], a: 0 },
        { q: "৪৯. ভিটামিন C-এর অভাবে কোন রোগ হয়?", o: ["ক) রিকেটস", "খ) স্কার্ভি", "গ) রাতকানা", "ঘ) বেরিবেরি"], a: 1 },
        { q: "৫০. ভিটামিন D-এর অভাবে শিশুদের কোন রোগ হতে পারে?", o: ["ক) স্কার্ভি", "খ) রিকেটস", "গ) রাতকানা", "ঘ) অ্যানিমিয়া"], a: 1 }
    ];

    const container = document.getElementById('quiz-container');

    // UI Render
    questionsData.forEach((q, index) => {
        const qCard = document.createElement('div');
        qCard.className = 'question-card';
        qCard.id = 'qcard-' + index;

        const qTitle = document.createElement('div');
        qTitle.className = 'question-title';
        qTitle.innerText = q.q;
        qCard.appendChild(qTitle);

        const optionsDiv = document.createElement('div');
        optionsDiv.className = 'options';

        q.o.forEach((opt, optIndex) => {
            const label = document.createElement('label');
            label.id = 'label-' + index + '-' + optIndex;
            
            const radio = document.createElement('input');
            radio.type = 'radio';
            radio.name = 'question-' + index;
            radio.value = optIndex;

            label.appendChild(radio);
            label.appendChild(document.createTextNode(' ' + opt));
            optionsDiv.appendChild(label);
        });

        qCard.appendChild(optionsDiv);
        container.appendChild(qCard);
    });

    // Score Calculator
    function calculateScore() {
        let score = 0;
        
        questionsData.forEach((q, index) => {
            const selectedOptions = document.getElementsByName('question-' + index);
            let answered = false;
            
            selectedOptions.forEach((radio) => {
                const label = document.getElementById('label-' + index + '-' + radio.value);
                
                // Reset colors first
                label.classList.remove('correct-ans', 'wrong-ans');
                
                if (radio.checked) {
                    answered = true;
                    if (parseInt(radio.value) === q.a) {
                        score++;
                        label.classList.add('correct-ans'); // সঠিক হলে সবুজ
                    } else {
                        label.classList.add('wrong-ans'); // ভুল হলে লাল
                    }
                }
            });
            
            // সঠিক উত্তরটি সব সময়ই দেখিয়ে দেওয়া
            const correctLabel = document.getElementById('label-' + index + '-' + q.a);
            if(answered) {
                correctLabel.classList.add('correct-ans');
            }
        });

        // ভেসে ওঠা পপআপ (Alert)
        alert(`পরীক্ষা শেষ!\n\nআপনার প্রাপ্ত নম্বর: ${score} / 50\n\nসঠিক উত্তরগুলো সবুজ এবং আপনার ভুল উত্তরগুলো লাল রঙে মার্ক করে দেওয়া হয়েছে।`);
        
        // একেবারে উপরে স্ক্রল করা
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
</script>
