<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>টেকনিক্যাল সাপোর্ট পোর্টাল - ইবনে তাইমিয়া স্কুল এন্ড কলেজ</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Noto Serif Bengali', 'Kalpurush', sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Header Styles & Animations */
        header {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
            padding: 40px 20px;
            text-align: center;
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .logo-container img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #fff;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
            animation: float 3s ease-in-out infinite;
            margin-bottom: 15px;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .institute-name {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 5px;
            animation: fadeInDown 1s ease-out;
        }

        .eiin {
            font-size: 16px;
            color: #d1d8e0;
            margin-bottom: 15px;
            animation: fadeInDown 1.2s ease-out;
        }

        .portal-title {
            font-size: 22px;
            font-weight: 600;
            color: #f1c40f;
            margin-bottom: 10px;
            animation: fadeInUp 1s ease-out;
        }

        .subtitle {
            font-size: 18px;
            color: #ecf0f1;
            animation: fadeInUp 1.2s ease-out;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Main Content & Buttons */
        main {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .button-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 800px;
        }

        .shift-btn {
            background: white;
            color: #2c3e50;
            border: none;
            padding: 20px 30px;
            font-size: 20px;
            font-weight: 600;
            border-radius: 15px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .shift-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(44, 83, 100, 0.1), transparent);
            transition: all 0.5s ease;
        }

        .shift-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 25px rgba(0,0,0,0.15);
            background: #2c5364;
            color: white;
        }

        .shift-btn:hover::before {
            left: 100%;
        }

        /* Footer */
        footer {
            background-color: #2c3e50;
            color: #ecf0f1;
            text-align: center;
            padding: 20px;
            font-size: 15px;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
        }

        /* Mobile Responsiveness */
        @media (max-width: 600px) {
            .institute-name { font-size: 22px; }
            .portal-title { font-size: 18px; }
            .subtitle { font-size: 16px; }
            .logo-container img { width: 80px; height: 80px; }
            .shift-btn { font-size: 18px; padding: 15px 20px; }
            .button-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <!-- Google Drive image direct view link -->
            <img src="https://drive.google.com/uc?export=view&id=1ZmxR46CCr7Ge5UntTMM_TbTeMJfdiqTD" alt="Institute Logo">
        </div>
        <h1 class="institute-name">ইবনে তাইমিয়া স্কুল এন্ড কলেজ</h1>
        <p class="eiin">EIIN-105751</p>
        
        <h2 class="portal-title">টেকনিক্যাল সাপোর্ট পোর্টাল</h2>
        <p class="subtitle">এসএসসি নির্বাচনি পরিক্ষা-২০২৬ ডিউটি রোস্টার</p>
    </header>

    <main>
        <div class="button-grid">
            <button class="shift-btn" onclick="alert('জবা শিফটের রুটিন লোড হচ্ছে...')">১। জবা শিফট</button>
            <button class="shift-btn" onclick="alert('শাপলা শিফটের রুটিন লোড হচ্ছে...')">২। শাপলা শিফট</button>
            <button class="shift-btn" onclick="alert('বেলি শিফটের রুটিন লোড হচ্ছে...')">৩। বেলি শিফট</button>
            <button class="shift-btn" onclick="alert('বকুল শিফটের রুটিন লোড হচ্ছে...')">৪। বকুল শিফট</button>
        </div>
    </main>

    <footer>
        সার্বিক তত্বাবধানে: জবা শিফট, ইবনে তাইমিয়া স্কুল এন্ড কলেজ।
    </footer>

</body>
</html>
