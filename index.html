<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>পরীক্ষার নোটিশ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'SolaimanLipi', 'Kalpurush', 'Hind Siliguri', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(-45deg, #0f172a, #1e1b4b, #311042, #020617);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
            padding: 20px;
            overflow-x: hidden;
        }

        /* ব্যাকগ্রাউন্ড গ্রেডিয়েন্ট অ্যানিমেশন */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* প্রধান কার্ডে গ্লাসমোরফিজম ও শাইনিং বর্ডার */
        .notice-card {
            position: relative;
            max-width: 800px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 50px 40px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6),
                        0 0 30px rgba(168, 85, 247, 0.2);
            animation: floatCard 4s ease-in-out infinite alternate;
        }

        @keyframes floatCard {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-10px); }
        }

        /* অ্যানিমেটেড হেডার ট্যাগ */
        .badge {
            display: inline-block;
            padding: 8px 24px;
            background: linear-gradient(90deg, #ff416c, #ff4b2b);
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            letter-spacing: 1px;
            box-shadow: 0 0 20px rgba(255, 65, 108, 0.6);
            margin-bottom: 25px;
            animation: pulse 1.8s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 15px rgba(255, 65, 108, 0.6); }
            50% { transform: scale(1.05); box-shadow: 0 0 30px rgba(255, 65, 108, 0.9); }
            100% { transform: scale(1); box-shadow: 0 0 15px rgba(255, 65, 108, 0.6); }
        }

        /* বিষয় শিরোনাম */
        .subject-title {
            font-size: 42px;
            font-weight: 800;
            background: linear-gradient(90deg, #38ef7d, #11998e, #00d2ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(56, 239, 125, 0.3);
        }

        /* মূল বার্তা */
        .message {
            font-size: 26px;
            line-height: 1.6;
            color: #f1f5f9;
            margin-bottom: 35px;
            font-weight: 500;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .highlight {
            color: #facc15;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(250, 204, 21, 0.5);
        }

        /* ডিভাইডার লাইন */
        .divider {
            height: 2px;
            width: 60%;
            margin: 0 auto 30px auto;
            background: linear-gradient(90deg, transparent, #a855f7, transparent);
        }

        /* শিক্ষকের তথ্য */
        .footer-info {
            display: inline-block;
            background: rgba(255, 255, 255, 0.03);
            padding: 20px 35px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .teacher-name {
            font-size: 28px;
            font-weight: bold;
            background: linear-gradient(90deg, #ff7e5f, #feb47b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .teacher-designation {
            font-size: 20px;
            color: #cbd5e1;
            margin-bottom: 4px;
        }

        .institution {
            font-size: 22px;
            color: #38bdf8;
            font-weight: 600;
        }

        /* মোবাইল স্ক্রিনের জন্য রেসপনসিভ স্টাইল */
        @media (max-width: 600px) {
            .notice-card { padding: 35px 20px; }
            .subject-title { font-size: 30px; }
            .message { font-size: 20px; }
            .teacher-name { font-size: 22px; }
            .teacher-designation { font-size: 16px; }
            .institution { font-size: 18px; }
        }
    </style>
</head>
<body>

    <div class="notice-card">
        <div class="badge">📌 জরুরি নোটিশ</div>
        
        <h1 class="subject-title">পদার্থবিজ্ঞান MCQ পরীক্ষা</h1>
        
        <p class="message">
            তোমাদের পদার্থবিজ্ঞান MCQ পরীক্ষাটির <span class="highlight">সময়সীমা শেষ</span>। 
            পরবর্তী পরীক্ষা অনুষ্ঠিত হলে ক্লাসে জানিয়ে দেয়া হবে।
        </p>

        <div class="divider"></div>

        <div class="footer-info">
            <div class="teacher-name">সাইফুল ইসলাম</div>
            <div class="teacher-designation">সহকারী শিক্ষক</div>
            <div class="institution">ইবনে তাইমিয়া স্কুল অ্যান্ড কলেজ</div>
        </div>
    </div>

</body>
</html>
