<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>টেকনিক্যাল সাপোর্ট পোর্টাল - ইবনে তাইমিয়া স্কুল এন্ড কলেজ</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Noto Serif Bengali', 'Kalpurush', sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Header Styles & Animations */
        header {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
            padding: 40px 20px;
            text-align: center;
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .logo-container img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #fff;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
            animation: float 3s ease-in-out infinite;
            margin-bottom: 15px;
            background: white;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .institute-name {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 5px;
            animation: fadeInDown 1s ease-out;
        }

        .eiin {
            font-size: 16px;
            color: #d1d8e0;
            margin-bottom: 15px;
            animation: fadeInDown 1.2s ease-out;
        }

        .portal-title {
            font-size: 22px;
            font-weight: 600;
            color: #f1c40f;
            margin-bottom: 10px;
            animation: fadeInUp 1s ease-out;
        }

        .subtitle {
            font-size: 18px;
            color: #ecf0f1;
            animation: fadeInUp 1.2s ease-out;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Main Content & Buttons */
        main {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .button-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 800px;
        }

        .shift-btn {
            background: white;
            color: #2c3e50;
            border: none;
            padding: 20px 30px;
            font-size: 20px;
            font-weight: 600;
            border-radius: 15px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .shift-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(44, 83, 100, 0.1), transparent);
            transition: all 0.5s ease;
        }

        .shift-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 25px rgba(0,0,0,0.15);
            background: #2c5364;
            color: white;
        }

        .shift-btn:hover::before {
            left: 100%;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            position: relative;
            animation: scaleIn 0.3s ease-out;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
        }

        @keyframes scaleIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 28px;
            cursor: pointer;
            color: #e74c3c;
            font-weight: bold;
            transition: color 0.3s ease;
        }

        .close-btn:hover {
            color: #c0392b;
        }

        .modal-text {
            font-size: 18px;
            margin-bottom: 20px;
            margin-top: 10px;
            color: #2c3e50;
            font-weight: 600;
            line-height: 1.5;
        }
        
        .shift-name-display {
            font-size: 20px;
            color: #e67e22;
            font-weight: 700;
            margin-bottom: 10px;
            display: block;
        }

        .qr-code {
            width: 180px;
            height: 180px;
            margin-bottom: 20px;
            border: 5px solid #ecf0f1;
            border-radius: 10px;
        }

        .download-btn {
            background: #27ae60;
            color: white;
            text-decoration: none;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            display: inline-block;
            transition: background 0.3s ease;
            box-shadow: 0 4px 10px rgba(39, 174, 96, 0.3);
        }

        .download-btn:hover {
            background: #219150;
            transform: translateY(-2px);
        }

        /* Footer */
        footer {
            background-color: #2c3e50;
            color: #ecf0f1;
            text-align: center;
            padding: 20px;
            font-size: 15px;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
        }

        /* Mobile Responsiveness */
        @media (max-width: 600px) {
            .institute-name { font-size: 22px; }
            .portal-title { font-size: 18px; }
            .subtitle { font-size: 16px; }
            .logo-container img { width: 80px; height: 80px; }
            .shift-btn { font-size: 18px; padding: 15px 20px; }
            .button-grid { grid-template-columns: 1fr; }
            .modal-text { font-size: 16px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="https://drive.google.com/thumbnail?id=1ZmxR46CCr7Ge5UntTMM_TbTeMJfdiqTD&sz=w500" alt="Institute Logo">
        </div>
        <h1 class="institute-name">ইবনে তাইমিয়া স্কুল এন্ড কলেজ</h1>
        <p class="eiin">EIIN-105751</p>
        
        <h2 class="portal-title">টেকনিক্যাল সাপোর্ট পোর্টাল</h2>
        <p class="subtitle">এসএসসি নির্বাচনি পরিক্ষা-২০২৬ ডিউটি রোস্টার</p>
    </header>

    <main>
        <div class="button-grid">
            <!-- বাটনগুলোতে onclick এর মাধ্যমে ফাইলের ID পাঠানো হচ্ছে -->
            <button class="shift-btn" onclick="openModal('জবা শিফট', '15TNLDoXNdDjmZ-5iML4-4jtlSW-ATEr8')">১। জবা শিফট</button>
            <button class="shift-btn" onclick="openModal('শাপলা শিফট', '1pAUbN2XPrfMqpWNZOGKKC5msdc-4y0XM')">২। শাপলা শিফট</button>
            <button class="shift-btn" onclick="openModal('বেলি শিফট', '1Bl-_CmU4gjs7-prGw9am3KNPN_RsdX1S')">৩। বেলি শিফট</button>
            <button class="shift-btn" onclick="openModal('বকুল শিফট', '1jERcRKF7GnxSxXGvEVovCowL7VAV_9z1')">৪। বকুল শিফট</button>
        </div>
    </main>

    <!-- Modal HTML Structure -->
    <div class="modal-overlay" id="qrModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <span class="shift-name-display" id="shiftNameDisplay"></span>
            <p class="modal-text">রোস্টারটি ডাউনলোড করতে QR Code স্ক্যান করুন অথবা ডাউনলোড বাটনে ক্লিক করুন।</p>
            
            <!-- QR Code Image (src will be updated by JS) -->
            <img src="" id="qrCodeImg" alt="QR Code" class="qr-code">
            <br>
            
            <!-- Download Button (href will be updated by JS) -->
            <a href="#" id="downloadBtn" class="download-btn" target="_blank">ডাউনলোড</a>
        </div>
    </div>

    <footer>
        সার্বিক তত্বাবধানে: জবা শিফট, ইবনে তাইমিয়া স্কুল এন্ড কলেজ।
    </footer>

    <!-- JavaScript for Dynamic Modal -->
    <script>
        function openModal(shiftName, driveFileId) {
            // পপ-আপের উপাদানগুলো সিলেক্ট করা
            const modal = document.getElementById('qrModal');
            const shiftDisplay = document.getElementById('shiftNameDisplay');
            const qrImg = document.getElementById('qrCodeImg');
            const downloadBtn = document.getElementById('downloadBtn');

            // শিফটের নাম সেট করা
            shiftDisplay.innerText = shiftName + ' রোস্টার';

            // ডাইনামিক QR Code জেনারেট করা
            const driveLink = `https://drive.google.com/file/d/${driveFileId}/view?usp=drivesdk`;
            qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(driveLink)}`;

            // ডাইরেক্ট ডাউনলোড লিংক সেট করা
            downloadBtn.href = `https://drive.google.com/uc?export=download&id=${driveFileId}`;

            // পপ-আপ ওপেন করা
            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('qrModal').style.display = 'none';
        }

        // পপ-আপের বাইরের অংশে ক্লিক করলে বন্ধ হওয়ার জন্য
        window.onclick = function(event) {
            let modal = document.getElementById('qrModal');
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }
    </script>
</body>
</html>
